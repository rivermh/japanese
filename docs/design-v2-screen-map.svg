<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400">
  <defs>
    <style>
      .canvas{fill:#f0efe9}.tile,.screen{fill:#fff;stroke:#daddd7;stroke-width:2}.top{fill:#202321}.rail{fill:#f0efea}.primary{fill:#334b78}.soft{fill:#e8edf6}.good{fill:#52745b}.warn{fill:#b8782d}.bad{fill:#c5523f}.line{stroke:#daddd7;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#202321}.name{font:700 20px Arial,sans-serif;fill:#202321}.text{font:14px Arial,sans-serif;fill:#202321}.small{font:12px Arial,sans-serif;fill:#676d68}.jp{font:700 23px 'Yu Gothic UI',sans-serif;fill:#202321}
    </style>
    <g id="desktop">
      <rect class="screen" width="420" height="270" rx="12"/><rect class="top" width="420" height="28" rx="12"/><rect class="top" y="16" width="420" height="12"/><rect class="rail" y="28" width="58" height="242"/>
    </g>
    <g id="mobile">
      <rect class="screen" width="125" height="270" rx="16" stroke="#202321" stroke-width="3"/><rect class="top" x="2" y="2" width="121" height="23" rx="14"/><rect class="rail" x="2" y="242" width="121" height="26" rx="13"/>
    </g>
  </defs>
  <rect class="canvas" width="1800" height="2400"/>
  <text x="60" y="60" class="title">Japanese Design Guide v2 · Desktop + Mobile Core Screen Map</text>
  <text x="60" y="90" class="small">Figma reconstruction blueprint · detailed behavior and tokens: DESIGN.md.md</text>

  <!-- 01 Home -->
  <g transform="translate(60 130)"><rect class="tile" width="540" height="690" rx="18"/><text x="22" y="38" class="name">01 Home</text>
    <use href="#desktop" x="20" y="58"/><rect x="91" y="103" width="125" height="112" rx="9" class="soft"/><circle cx="153" cy="151" r="31" fill="#d7c2ad"/><text x="131" y="156" class="small">Haru</text><rect x="226" y="103" width="190" height="112" rx="9" class="screen"/><text x="240" y="128" class="text">오늘의 학습</text><rect x="240" y="142" width="155" height="7" rx="4" class="soft"/><rect x="240" y="142" width="88" height="7" rx="4" class="primary"/><text x="240" y="169" class="small">복습 6 · 새 학습 7</text><rect x="240" y="181" width="110" height="24" rx="7" class="primary"/><rect x="91" y="226" width="325" height="62" rx="8" class="screen"/><text x="106" y="253" class="small">7일 리듬  ● ● ● ○ ● ● ○</text>
    <use href="#mobile" x="205" y="360"/><rect x="217" y="397" width="101" height="78" rx="9" class="soft"/><circle cx="243" cy="428" r="18" fill="#d7c2ad"/><text x="269" y="423" class="small">오늘 13개</text><rect x="268" y="438" width="43" height="20" rx="6" class="primary"/><rect x="217" y="486" width="101" height="48" rx="8" class="screen"/><text x="20" y="655" class="small">Today CTA를 첫 viewport에 두고 캐릭터와 계획을 한 장면으로 묶는다.</text>
  </g>

  <!-- 02 Today -->
  <g transform="translate(630 130)"><rect class="tile" width="540" height="690" rx="18"/><text x="22" y="38" class="name">02 Today Study</text>
    <use href="#desktop" x="20" y="58"/><rect x="92" y="98" width="324" height="18" rx="6" class="soft"/><rect x="92" y="98" width="132" height="18" rx="6" class="primary"/><rect x="122" y="130" width="270" height="155" rx="10" class="screen"/><text x="140" y="156" class="small">복습 · WORD · 4/10</text><text x="140" y="190" class="jp">食べる</text><text x="140" y="214" class="small">たべる · 먹다</text><line x1="140" y1="230" x2="374" y2="230" class="line"/><rect x="140" y="248" width="90" height="24" rx="7" class="screen"/><rect x="284" y="248" width="90" height="24" rx="7" class="primary"/>
    <use href="#mobile" x="205" y="360"/><rect x="217" y="396" width="101" height="7" rx="4" class="soft"/><rect x="217" y="396" width="42" height="7" rx="4" class="primary"/><text x="217" y="428" class="small">4/10 · 복습</text><text x="217" y="461" class="jp">食べる</text><text x="217" y="486" class="small">たべる</text><rect x="217" y="566" width="46" height="27" rx="7" class="screen"/><rect x="270" y="566" width="48" height="27" rx="7" class="primary"/><text x="20" y="655" class="small">한 카드, 고정 진행률, 하단 응답. 이동 후에도 DB 세션 위치를 복원한다.</text>
  </g>

  <!-- 03 Search -->
  <g transform="translate(1200 130)"><rect class="tile" width="540" height="690" rx="18"/><text x="22" y="38" class="name">03 Search &amp; Results</text>
    <use href="#desktop" x="20" y="58"/><rect x="82" y="96" width="334" height="28" rx="8" class="screen"/><rect x="82" y="136" width="78" height="164" rx="8" class="rail"/><g><rect x="170" y="136" width="246" height="52" class="screen"/><rect x="170" y="188" width="246" height="52" class="screen"/><rect x="170" y="240" width="246" height="52" class="screen"/></g><text x="182" y="163" class="jp">食べる</text>
    <use href="#mobile" x="205" y="360"/><rect x="217" y="396" width="101" height="25" rx="7" class="screen"/><rect x="217" y="430" width="45" height="20" rx="10" class="soft"/><rect x="268" y="430" width="50" height="20" rx="10" class="screen"/><g><rect x="217" y="462" width="101" height="43" class="screen"/><rect x="217" y="505" width="101" height="43" class="screen"/><rect x="217" y="548" width="101" height="43" class="screen"/></g><text x="20" y="655" class="small">검색을 독립 목적지로 만들고 desktop filter rail, mobile filter sheet를 사용한다.</text>
  </g>

  <!-- 04 Word -->
  <g transform="translate(60 850)"><rect class="tile" width="540" height="690" rx="18"/><text x="22" y="38" class="name">04 Word Detail</text>
    <use href="#desktop" x="20" y="58"/><text x="93" y="125" class="jp">食べる</text><text x="93" y="149" class="small">たべる · 동사 · N5 · 학습 중</text><line x1="93" y1="163" x2="338" y2="163" class="line"/><text x="93" y="192" class="text">1. 먹다, 식사하다</text><text x="106" y="222" class="jp">野菜を食べます。</text><rect x="350" y="112" width="64" height="105" rx="8" class="soft"/>
    <use href="#mobile" x="205" y="360"/><text x="217" y="410" class="jp">食べる</text><text x="217" y="434" class="small">たべる · N5</text><line x1="217" y1="447" x2="318" y2="447" class="line"/><text x="217" y="474" class="text">1. 먹다</text><text x="217" y="507" class="jp">野菜を</text><text x="217" y="532" class="jp">食べます。</text><text x="20" y="655" class="small">Meaning 아래 linked Example을 배치하고 저장·학습 행동은 별도 rail/sheet로 둔다.</text>
  </g>

  <!-- 05 Grammar -->
  <g transform="translate(630 850)"><rect class="tile" width="540" height="690" rx="18"/><text x="22" y="38" class="name">05 Grammar Detail</text>
    <use href="#desktop" x="20" y="58"/><text x="93" y="125" class="jp">～ように</text><text x="93" y="151" class="text">~하도록, ~하게</text><line x1="93" y1="165" x2="414" y2="165" class="line"/><text x="93" y="192" class="text">접속과 예문</text><text x="93" y="224" class="jp">忘れないように</text><text x="93" y="249" class="small">사용 상황 · nuance · 관련 문법</text>
    <use href="#mobile" x="205" y="360"/><text x="217" y="410" class="jp">～ように</text><text x="217" y="436" class="small">~하도록</text><line x1="217" y1="449" x2="318" y2="449" class="line"/><text x="217" y="477" class="text">예문</text><text x="217" y="510" class="jp">忘れない</text><text x="217" y="535" class="jp">ように</text><text x="20" y="655" class="small">원본과 approved curation의 위계를 분리하고 comparison·confirmation을 연결한다.</text>
  </g>

  <!-- 06 Weakness -->
  <g transform="translate(1200 850)"><rect class="tile" width="540" height="690" rx="18"/><text x="22" y="38" class="name">06 Weaknesses</text>
    <use href="#desktop" x="20" y="58"/><rect x="92" y="99" width="145" height="27" rx="8" class="primary"/><rect x="92" y="141" width="322" height="48" class="soft"/><rect x="92" y="189" width="322" height="48" class="screen"/><rect x="92" y="237" width="322" height="48" class="screen"/><text x="105" y="169" class="text">～ように · 최근 오답 3</text>
    <use href="#mobile" x="205" y="360"/><rect x="217" y="396" width="101" height="27" rx="7" class="primary"/><rect x="217" y="436" width="101" height="53" class="soft"/><rect x="217" y="489" width="101" height="53" class="screen"/><rect x="217" y="542" width="101" height="53" class="screen"/><text x="20" y="655" class="small">현재/개선 탭과 실제 오답 근거를 보여주고 10개 집중 복습을 첫 행동으로 둔다.</text>
  </g>

  <!-- 07 Report -->
  <g transform="translate(60 1570)"><rect class="tile" width="540" height="690" rx="18"/><text x="22" y="38" class="name">07 Weekly Report</text>
    <use href="#desktop" x="20" y="58"/><text x="92" y="120" class="name">5일 · 42개 · 81%</text><g fill="#334b78"><rect x="98" y="220" width="24" height="55"/><rect x="137" y="188" width="24" height="87"/><rect x="176" y="237" width="24" height="38"/><rect x="215" y="170" width="24" height="105"/><rect x="254" y="205" width="24" height="70"/><rect x="293" y="252" width="24" height="23"/><rect x="332" y="194" width="24" height="81"/></g><text x="92" y="302" class="small">다음 행동 · 밀린 복습 먼저 처리하기</text>
    <use href="#mobile" x="205" y="360"/><text x="217" y="405" class="text">5일 · 42개</text><g fill="#334b78"><rect x="220" y="505" width="9" height="42"/><rect x="234" y="483" width="9" height="64"/><rect x="248" y="520" width="9" height="27"/><rect x="262" y="472" width="9" height="75"/><rect x="276" y="498" width="9" height="49"/><rect x="290" y="530" width="9" height="17"/><rect x="304" y="490" width="9" height="57"/></g><text x="20" y="655" class="small">주간 요약 → 7일 흐름 → 약점/개선 → 근거 있는 다음 행동 순서다.</text>
  </g>

  <!-- 08 Progress -->
  <g transform="translate(630 1570)"><rect class="tile" width="540" height="690" rx="18"/><text x="22" y="38" class="name">08 Progress</text>
    <use href="#desktop" x="20" y="58"/><text x="92" y="116" class="text">N3 · 내 학습 범위</text><text x="92" y="151" class="small">단어 18%</text><rect x="160" y="141" width="245" height="11" rx="6" class="soft"/><rect x="160" y="141" width="44" height="11" rx="6" class="primary"/><text x="92" y="187" class="small">문법 12%</text><rect x="160" y="177" width="245" height="11" rx="6" class="soft"/><rect x="160" y="177" width="30" height="11" rx="6" class="good"/><line x1="92" y1="215" x2="405" y2="215" class="line"/><text x="92" y="248" class="text">N4</text><text x="92" y="278" class="text">N5</text>
    <use href="#mobile" x="205" y="360"/><text x="217" y="407" class="text">N3 · 학습 범위</text><text x="217" y="440" class="small">단어 18%</text><rect x="217" y="451" width="101" height="9" rx="5" class="soft"/><rect x="217" y="451" width="18" height="9" rx="5" class="primary"/><text x="217" y="489" class="small">문법 12%</text><rect x="217" y="500" width="101" height="9" rx="5" class="soft"/><rect x="217" y="500" width="12" height="9" rx="5" class="good"/><text x="20" y="655" class="small">Level마다 WORD/GRAMMAR 상태 분포와 기존 학습 흐름으로 가는 행동을 둔다.</text>
  </g>

  <!-- 09 Onboarding -->
  <g transform="translate(1200 1570)"><rect class="tile" width="540" height="690" rx="18"/><text x="22" y="38" class="name">09 Onboarding</text>
    <use href="#desktop" x="20" y="58"/><text x="92" y="110" class="small">3/4 · 학습량</text><rect x="92" y="122" width="322" height="8" rx="4" class="soft"/><rect x="92" y="122" width="242" height="8" rx="4" class="primary"/><text x="92" y="164" class="text">하루 학습량을 골라주세요</text><rect x="92" y="184" width="96" height="76" rx="9" class="screen"/><rect x="201" y="184" width="96" height="76" rx="9" class="soft"/><rect x="310" y="184" width="96" height="76" rx="9" class="screen"/><rect x="310" y="275" width="96" height="27" rx="7" class="primary"/>
    <use href="#mobile" x="205" y="360"/><text x="217" y="404" class="small">3/4 · 학습량</text><rect x="217" y="416" width="101" height="7" rx="4" class="soft"/><rect x="217" y="416" width="76" height="7" rx="4" class="primary"/><rect x="217" y="450" width="101" height="38" rx="8" class="screen"/><rect x="217" y="496" width="101" height="38" rx="8" class="soft"/><rect x="217" y="542" width="101" height="38" rx="8" class="screen"/><text x="20" y="655" class="small">목적 → 범위 → 학습량 → 확인. 한 단계에 한 종류의 결정만 둔다.</text>
