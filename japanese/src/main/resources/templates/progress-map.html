<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('JLPT 진도')}"></head>
<body><header th:replace="~{fragments/layout :: header('progress')}"></header>
<main id="main-content" class="page-shell"><header class="page-heading"><div><p class="eyebrow">JLPT PROGRESS</p><h1>내 학습 진도</h1><p class="subtle">공개 콘텐츠와 현재 학습 상태를 기준으로 표시합니다.</p></div><a class="button button-secondary" href="/today">오늘의 학습</a></header>
    <section class="surface progress-map"><article class="progress-level" th:each="level : ${progressMap.levels}" th:classappend="${level.inLearningScope ? ' in-scope' : ''}"><header><div><span class="level-pill" th:text="${level.code}">N5</span><h2 th:text="${level.name}">JLPT N5</h2></div><span class="status-pill" th:if="${level.inLearningScope}">내 학습 범위</span></header><div class="progress-type" th:each="type : ${level.contentTypes}"><div class="progress-type-heading"><strong th:text="${type.type.name() == 'WORD' ? '단어' : '문법'}">단어</strong><span th:text="${'숙달 ' + type.completionPercent + '% · 전체 ' + type.total}">숙달 0%</span><a th:href="@{/study(level=${level.code},type=${type.type.name()})}">계속 학습 →</a></div><progress max="100" th:value="${type.completionPercent}"></progress><dl class="progress-breakdown"><div><dt>미학습</dt><dd th:text="${type.unstarted}">0</dd></div><div><dt>학습 중</dt><dd th:text="${type.learning}">0</dd></div><div><dt>복습 중</dt><dd th:text="${type.review}">0</dd></div><div><dt>숙달</dt><dd th:text="${type.mastered}">0</dd></div><div th:if="${type.suspended > 0}"><dt>보류</dt><dd th:text="${type.suspended}">0</dd></div></dl></div></article></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
