<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${collection.name})}"></head>
<body><header th:replace="~{fragments/layout :: header('collections')}"></header>
<main id="main-content" class="page-shell">
    <header class="page-heading"><div><p class="eyebrow">MY COLLECTION</p><h1 th:text="${collection.name}"></h1><p class="subtle" th:text="${#lists.size(collection.contents) + '개 콘텐츠'}"></p></div><div class="toolbar"><a class="button" th:href="@{/collections/{id}/study(id=${collection.id})}">이 단어장 학습하기</a><a class="button button-secondary" href="/collections">목록</a></div></header>
    <section class="surface detail-section"><form class="compact-add-form" th:action="@{/collections/{id}/rename(id=${collection.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="collection-rename">이름</label><input id="collection-rename" name="name" maxlength="80" required th:value="${collection.name}"><button class="button-quiet" type="submit">변경</button></form>
        <div class="content-list" th:unless="${#lists.isEmpty(collection.contents)}"><article class="content-row" th:each="content : ${collection.contents}"><span class="type-pill" th:text="${content.type.name() == 'WORD' ? '단어' : '문법'}"></span><a class="content-main" th:href="@{/contents/{slug}(slug=${content.slug})}"><h3 lang="ja" th:text="${content.title}"></h3><p class="reading" lang="ja" th:if="${content.reading != null}" th:text="${content.reading}"></p><p class="description" th:text="${content.description}"></p></a><form th:action="@{/collections/{id}/items/{slug}/remove(id=${collection.id},slug=${content.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button-quiet" type="submit">제거</button></form></article></div>
        <div class="empty-state" th:if="${#lists.isEmpty(collection.contents)}"><p>아직 콘텐츠가 없습니다.</p><p class="subtle">사전 상세에서 이 단어장에 단어 또는 문법을 추가하세요.</p><a class="button button-secondary" href="/#library">콘텐츠 찾기</a></div>
    </section>
    <form class="delete-row" th:action="@{/collections/{id}/delete(id=${collection.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button-quiet" type="submit">이 단어장 삭제</button></form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
