<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('콘텐츠 상세 검수')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>
<main id="main-content" class="page-shell detail-shell admin-shell" th:with="d=${content.content},s=${content.content.summary}">
  <a href="/admin/contents">목록</a><p class="admin-message" th:if="${adminMessage}" th:text="${adminMessage}"></p><p class="admin-error" th:if="${adminError}" th:text="${adminError}"></p>
  <article class="admin-detail"><header><div class="card-meta"><span class="type-pill" th:text="${s.type}"></span><span class="status-pill" th:classappend="${' status-'+#strings.toLowerCase(s.reviewStatus.name())}" th:text="${s.reviewStatus}"></span><span th:text="${content.published?'공개':'미공개'}"></span></div><h1 th:text="${s.title}"></h1><p th:if="${s.reading}" th:text="${s.reading}"></p></header>
    <section><h2>저장된 원본 데이터</h2><dl class="admin-facts"><div><dt>slug</dt><dd><code th:text="${s.slug}"></code></dd></div><div><dt>JLPT</dt><dd th:text="${s.level}"></dd></div><div><dt>Category</dt><dd th:text="${#strings.listJoin(s.categories,', ')}"></dd></div><div><dt>sourceRef</dt><dd th:text="${s.sourceRef}"></dd></div><div th:if="${d.partOfSpeech}"><dt>품사</dt><dd th:text="${d.partOfSpeech}"></dd></div><div th:if="${d.pitchAccent}"><dt>Pitch accent raw</dt><dd th:text="${d.pitchAccent}"></dd></div></dl></section>
    <section th:if="${d.source}"><h2>출처·라이선스</h2><dl class="admin-facts"><div><dt>이름/버전</dt><dd th:text="${d.source.displayName+' '+(d.source.version?:'')}"></dd></div><div><dt>License</dt><dd th:text="${d.source.licenseSummary}"></dd></div><div><dt>Attribution</dt><dd th:text="${d.source.attribution}"></dd></div><div><dt>사용 메모</dt><dd th:text="${d.source.usageNote}"></dd></div></dl></section>
    <section class="quality-audit"><h2>Quality Audit</h2><p th:if="${content.qualityAudit.issueCount==0}" class="subtle">No quality issues detected.</p><ul th:if="${content.qualityAudit.issueCount>0}"><li th:each="issue:${content.qualityAudit.issues}"><span class="status-pill" th:classappend="${' status-'+#strings.toLowerCase(issue.severity.name())}" th:text="${issue.severity}"></span> <strong th:text="${issue.type}"></strong><span th:text="${issue.message}"></span></li></ul></section>
    <section th:if="${!d.meanings.empty}"><h2>Meaning</h2><ol><li th:each="m:${d.meanings}"><strong th:text="${m.languageTag}"></strong> <span th:text="${m.text}"></span></li></ol></section><section th:if="${d.grammar}"><h2>Grammar</h2><p th:text="${d.grammar.explanation}"></p><p th:if="${d.grammar.connection}" th:text="${d.grammar.connection}"></p></section>
    <section th:if="${!d.examples.empty}"><h2>Example · Meaning 연결</h2><article class="admin-example" th:each="e:${d.examples}"><strong th:text="${e.japaneseText}"></strong><span th:if="${e.reading}" th:text="${e.reading}"></span><span th:if="${e.translation}" th:text="${e.translation}"></span><small th:if="${e.meaning}" th:text="${'연결 Meaning: '+e.meaning}"></small></article></section>
    <details th:each="raw:${content.rawSources}"><summary th:text="${'Import 원본 · '+raw.noteType+' #'+raw.sourceNoteId}"></summary><dl class="admin-facts"><div><dt>source</dt><dd th:text="${raw.sourceRef}"></dd></div><div><dt>tags</dt><dd th:text="${raw.tags}"></dd></div></dl><h3>Field names</h3><pre th:text="${raw.fieldNames}"></pre><h3>Field values</h3><pre th:text="${raw.fieldValues}"></pre></details>
    <section><h2>검토 이력</h2><ol class="review-history"><li th:each="a:${content.audits}"><strong th:text="${(a.previousStatus?:'없음)+' → '+a.status}"></strong><span th:text="${a.reviewer}"></span><span th:if="${a.note}" th:text="${a.note}"></span><time th:text="${a.reviewedAt}"></time></li></ol><p th:if="${content.audits.empty}">아직 이력이 없습니다.</p></section>
    <div class="admin-actions" th:if="${s.reviewStatus.name()=='PENDING'}"><form th:action="@{/admin/contents/{id}/approve(id=${s.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="note" maxlength="1000" placeholder="승인 메모 (선택)"><button>승인·공개</button></form><form th:action="@{/admin/contents/{id}/reject(id=${s.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="note" required maxlength="1000" placeholder="반려 사유"><button class="reject-button">반려</button></form></div>
  </article>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
