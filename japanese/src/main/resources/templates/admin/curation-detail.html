<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Curated 문법 상세')}"></head><body>
<header th:replace="~{fragments/layout :: header('admin')}"></header><main id="main-content" class="page-shell detail-shell admin-shell" th:with="s=${record.summary}">
<a th:href="@{/admin/grammars/curation(recordType=${s.type})}">← Curated 목록</a><p class="admin-message" th:if="${adminMessage}" th:text="${adminMessage}"></p><p class="admin-error" th:if="${adminError}" th:text="${adminError}"></p>
<article class="admin-detail"><header><div class="card-meta"><span class="type-pill" th:text="${s.type}"></span><span class="status-pill" th:classappend="${' status-'+#strings.toLowerCase(s.reviewStatus.name())}" th:text="${s.reviewStatus}"></span><span th:text="${s.published?'공개':'미공개'}"></span></div><h1 th:text="${s.grammar+(s.secondaryGrammar!=null?' ↔ '+s.secondaryGrammar:'')}"></h1><p th:if="${s.relationType}" th:text="${s.relationType}"></p></header>
<section><h2>Source</h2><p><code th:text="${s.sourceRef}"></code></p></section>
<section class="admin-field-list"><div th:if="${record.nuance}"><h2>Nuance</h2><p th:text="${record.nuance}"></p></div><div th:if="${record.usage}"><h2>Usage</h2><p th:text="${record.usage}"></p></div><div th:if="${record.formation}"><h2>Connection supplement</h2><p th:text="${record.formation}"></p></div><div th:if="${record.commonMistake}"><h2>Common mistakes</h2><p th:text="${record.commonMistake}"></p></div><div th:if="${record.learnerNote}"><h2>Learning notes</h2><p th:text="${record.learnerNote}"></p></div><div th:if="${record.keyDifference}"><h2>핵심 차이</h2><p th:text="${record.keyDifference}"></p></div><div th:if="${record.usageDifference}"><h2>사용 차이</h2><p th:text="${record.usageDifference}"></p></div><div th:if="${record.commonConfusion}"><h2>헷갈리는 점</h2><p th:text="${record.commonConfusion}"></p></div><div th:if="${record.questionType}"><h2>문제</h2><p th:text="${record.questionType}"></p><strong th:text="${record.prompt}"></strong><p th:if="${record.context}" th:text="${record.context}"></p><ol><li th:each="c:${record.choices}" th:classappend="${c.correct?' is-correct':''}"><span th:text="${c.text}"></span><strong th:if="${c.correct}"> · 정답</strong></li></ol><p th:if="${record.explanation}" th:text="${record.explanation}"></p></div></section>
<section><h2>검토 이력</h2><ol class="review-history"><li th:each="a:${record.audits}"><strong th:text="${a.previousStatus+' → '+a.status}"></strong><span th:text="${a.reviewer}"></span><span th:if="${a.note}" th:text="${a.note}"></span><time th:text="${a.reviewedAt}"></time></li></ol><p th:if="${record.audits.empty}">아직 이력이 없습니다.</p></section>
<div class="admin-actions" th:if="${s.reviewStatus.name()=='PENDING'}"><form th:action="@{/admin/grammars/curation/{type}/{id}/approve(type=${s.type},id=${s.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="note" maxlength="1000" placeholder="승인 메모 (선택)"><button>승인·공개</button></form><form th:action="@{/admin/grammars/curation/{type}/{id}/reject(type=${s.type},id=${s.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="note" maxlength="1000" required placeholder="반려 사유"><button class="reject-button">반려</button></form></div>
</article></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
