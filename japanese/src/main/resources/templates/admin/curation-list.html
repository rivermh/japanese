<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Curated 문법 검수')}"></head><body>
<header th:replace="~{fragments/layout :: header('admin')}"></header><main id="main-content" class="page-shell admin-shell">
<header class="page-heading"><div><p class="eyebrow">GRAMMAR CURATION</p><h1>Curated 문법 검수</h1><p class="subtle">원본 Grammar 승인과 독립적으로 각 record를 검수합니다.</p></div><a href="/admin">관리자 홈</a></header>
<form class="admin-filter" method="get"><label>Record<select name="recordType"><option th:each="v:${T(com.japanese.content.entity.CurationRecordType).values()}" th:value="${v}" th:text="${v}" th:selected="${v==recordType}"></option></select></label><label>상태<select name="status"><option value="">전체</option><option th:each="v:${T(com.japanese.content.entity.ReviewStatus).values()}" th:value="${v}" th:text="${v}" th:selected="${v==status}"></option></select></label><label>공개<select name="published"><option value="">전체</option><option value="false" th:selected="${published==false}">미공개</option><option value="true" th:selected="${published==true}">공개</option></select></label><label>JLPT<select name="level"><option value="">전체</option><option value="N5" th:selected="${level=='N5'}">N5</option><option value="N4" th:selected="${level=='N4'}">N4</option><option value="N3" th:selected="${level=='N3'}">N3</option><option value="N2" th:selected="${level=='N2'}">N2</option><option value="N1" th:selected="${level=='N1'}">N1</option></select></label><label>Grammar<input name="keyword" th:value="${keyword}" placeholder="대상 패턴"></label><label>관계<select name="relationType"><option value="">전체</option><option th:each="v:${T(com.japanese.content.entity.GrammarRelationType).values()}" th:value="${v}" th:text="${v}" th:selected="${v==relationType}"></option></select></label><button>조회</button></form>
<p class="admin-result-count" th:text="${result.totalElements+'개 · '+(result.number+1)+' / '+(result.totalPages==0?1:result.totalPages)+' 페이지'}"></p><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>상태</th><th>Record</th><th>대상 Grammar</th><th>내용</th><th>JLPT</th><th>공개</th><th></th></tr></thead><tbody><tr th:each="row:${result.content}"><td><span class="status-pill" th:classappend="${' status-'+#strings.toLowerCase(row.reviewStatus.name())}" th:text="${row.reviewStatus}"></span></td><td th:text="${row.type}"></td><td><strong th:text="${row.grammar}"></strong><small th:if="${row.secondaryGrammar}" th:text="${' ↔ '+row.secondaryGrammar}"></small><small th:if="${row.relationType}" th:text="${row.relationType}"></small></td><td th:text="${row.summary}"></td><td th:text="${row.jlpt}"></td><td th:text="${row.published?'공개':'미공개'}"></td><td><a th:href="@{/admin/grammars/curation/{type}/{id}(type=${row.type},id=${row.id})}">검수하기</a></td></tr></tbody></table></div><p class="empty-state" th:if="${result.empty}">조건에 맞는 record가 없습니다.</p>
<nav class="pagination"><a th:if="${result.hasPrevious()}" th:href="@{/admin/grammars/curation(recordType=${recordType},status=${status},published=${published},level=${level},keyword=${keyword},relationType=${relationType},page=${result.number-1})}">이전</a><a th:if="${result.hasNext()}" th:href="@{/admin/grammars/curation(recordType=${recordType},status=${status},published=${published},level=${level},keyword=${keyword},relationType=${relationType},page=${result.number+1})}">다음</a></nav>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
