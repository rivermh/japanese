<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 콘텐츠 검수')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>
<main id="main-content" class="page-shell admin-shell">
  <header class="page-heading"><div><p class="eyebrow">ADMIN CONTENT REVIEW</p><h1>콘텐츠 검수</h1><p class="subtle">원본을 변경하지 않고 공개 가능 여부와 품질 감사 결과를 확인합니다.</p></div></header>
  <section class="admin-metrics" aria-label="검수 현황">
    <a href="/admin/contents?status=PENDING"><span>전체 대기</span><strong th:text="${dashboard.pending}">0</strong></a>
    <a href="/admin/contents?status=PENDING&amp;type=WORD"><span>단어 대기</span><strong th:text="${dashboard.pendingWords}">0</strong></a>
    <a href="/admin/contents?status=PENDING&amp;type=GRAMMAR"><span>문법 대기</span><strong th:text="${dashboard.pendingGrammar}">0</strong></a>
    <a href="/admin/grammars/curation?status=PENDING"><span>Curated 대기</span><strong th:text="${dashboard.curatedPending}">0</strong></a>
    <div><span>최근 7일 승인</span><strong th:text="${dashboard.recentApproved}">0</strong></div>
    <div><span>최근 7일 반려</span><strong th:text="${dashboard.recentRejected}">0</strong></div>
  </section>
  <section class="admin-metrics quality-summary" aria-label="N5 품질 감사">
    <a href="/admin/contents?level=N5&amp;type=WORD&amp;qualityIssue=true"><span>N5 WORD 품질</span><strong th:text="${dashboard.n5Words.total}">0</strong><small th:text="${'정상 '+dashboard.n5Words.clean+' · 경고 '+dashboard.n5Words.warning+' · 오류 '+dashboard.n5Words.error}"></small></a>
    <a href="/admin/contents?level=N5&amp;type=GRAMMAR&amp;qualityIssue=true"><span>N5 GRAMMAR 품질</span><strong th:text="${dashboard.n5Grammars.total}">0</strong><small th:text="${'정상 '+dashboard.n5Grammars.clean+' · 경고 '+dashboard.n5Grammars.warning+' · 오류 '+dashboard.n5Grammars.error}"></small></a>
  </section>
  <nav class="admin-shortcuts"><a class="button" href="/admin/contents?status=PENDING">일반 콘텐츠 검수</a><a class="button-secondary" href="/admin/grammars/curation?status=PENDING">Curated 문법 검수</a><a class="button-secondary" href="/admin/normalized-candidates/reviews?candidateType=VOCABULARY">정규화 후보 페어 검토</a><a class="button-secondary" href="/admin/normalized-candidates/promotion-readiness?candidateType=VOCABULARY">Promotion Readiness (dry-run)</a><a class="button-secondary" href="/admin/content-sources">출처 권리 검토</a></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
