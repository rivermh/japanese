<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('학습 목록')}"></head>
<body><header th:replace="~{fragments/layout :: header('queue')}"></header>
<main id="main-content" class="page-shell">
    <header class="page-heading"><div><p class="eyebrow">LEARNING QUEUE</p><h1>앞으로 공부할 표현</h1><p class="subtle">정규 오늘의 학습에서 새 콘텐츠를 고를 때 먼저 반영됩니다.</p></div><a class="button button-secondary" href="/today">오늘의 학습</a></header>
    <section class="surface detail-section"><div class="section-heading"><h2>학습 목록 <span class="subtle" th:text="${#lists.size(queue) + '개'}"></span></h2><a class="text-link" href="/#library">콘텐츠 찾기</a></div>
        <div class="content-list" th:unless="${#lists.isEmpty(queue)}"><article class="content-row" th:each="entry : ${queue}"><span class="type-pill" th:text="${entry.content.type.name() == 'WORD' ? '단어' : '문법'}"></span><a class="content-main" th:href="@{/contents/{slug}(slug=${entry.content.slug})}"><h3 lang="ja" th:text="${entry.content.title}"></h3><p class="reading" lang="ja" th:if="${entry.content.reading != null}" th:text="${entry.content.reading}"></p><p class="description" th:text="${entry.content.description}"></p></a><form th:action="@{/contents/{slug}/study-queue/remove(slug=${entry.content.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="returnTo" value="/study-queue"><button class="button-quiet" type="submit">제거</button></form></article></div>
        <div class="empty-state" th:if="${#lists.isEmpty(queue)}"><p>아직 학습 목록이 비어 있어요.</p><p class="subtle">사전 상세에서 학습 목록에 추가하면 다음 새 학습에 우선 반영됩니다.</p><a class="button" href="/#library">단어·문법 찾기</a></div>
    </section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
