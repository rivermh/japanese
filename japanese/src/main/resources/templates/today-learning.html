<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('오늘의 학습')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('today')}"></header>
<main id="main-content" class="page-shell lesson-shell">
    <header class="page-heading"><div><p class="eyebrow">TODAY'S SESSION</p><h1>오늘의 학습</h1><p class="subtle">복습을 먼저 하고, 새 콘텐츠를 차례로 익혀요.</p></div><a class="text-link" href="/">홈으로</a></header>
    <section class="session-toolbar" aria-label="오늘 학습 진행 상태"><div class="session-goal"><div class="progress-label"><strong th:text="${todaySession.currentNumber + ' / ' + todaySession.totalCount}">1 / 10</strong><span th:text="${todaySession.remainingCount + '개 남음'}">9개 남음</span></div><progress th:value="${todaySession.completedCount}" th:max="${todaySession.totalCount}">0</progress></div><ol class="session-steps"><li th:classappend="${todaySession.currentActivityType.name() == 'REVIEW' ? 'active' : ''}">복습 <strong th:text="${todaySession.reviewCount}">0</strong></li><li th:classappend="${todaySession.currentActivityType.name() == 'NEW' and lesson.summary.type.name() == 'WORD' ? 'active' : ''}">새 단어 <strong th:text="${todaySession.newWordCount}">0</strong></li><li th:classappend="${todaySession.currentActivityType.name() == 'NEW' and lesson.summary.type.name() == 'GRAMMAR' ? 'active' : ''}">새 문법 <strong th:text="${todaySession.newGrammarCount}">0</strong></li></ol></section>
    <article class="surface session-card"><header class="lesson-heading"><div><div class="tag-row"><span class="type-pill" th:text="${todaySession.currentActivityType.name() == 'REVIEW' ? '복습' : '새 학습'}">새 학습</span><span class="type-pill" th:text="${lesson.summary.type.name() == 'WORD' ? '단어' : '문법'}">단어</span><span class="level-pill" th:each="level : ${lesson.summary.levels}" th:text="${level.system + ' ' + level.code}"></span></div><h2 lang="ja" th:text="${lesson.summary.title}">食べる</h2><p class="reading" lang="ja" th:if="${lesson.summary.reading != null}" th:text="${lesson.summary.reading}">たべる</p></div><span class="count" th:text="${'카드 ' + todaySession.currentNumber + ' / ' + todaySession.totalCount}">카드 1 / 10</span></header><div class="lesson-paper" th:replace="~{fragments/content :: lessonBody(${lesson})}"></div><div class="lesson-actions"><form th:action="@{/today/{slug}/complete(slug=${lesson.summary.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="result" value="CORRECT"><button type="submit" th:text="${todaySession.currentActivityType.name() == 'REVIEW' ? '기억하고 있어요' : '이해했어요 · 다음'}">이해했어요 · 다음</button></form><form th:action="@{/today/{slug}/complete(slug=${lesson.summary.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="result" value="INCORRECT"><button class="button-secondary" type="submit">다시 볼게요</button></form><a class="text-link" th:href="@{/contents/{slug}(slug=${lesson.summary.slug})}">상세 보기</a></div></article>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
