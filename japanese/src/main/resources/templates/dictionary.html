<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('일본어 사전')}"></head>
<body><header th:replace="~{fragments/layout :: header('search')}"></header>
<main id="main-content" class="page-shell"><div class="dictionary-shell">
    <header class="dictionary-head"><div class="dictionary-title"><h1>일본어 사전</h1><p>표기·읽기·한국어 뜻·문법을 한 번에 찾습니다.</p></div><form class="dictionary-query" action="/dictionary" method="get" role="search"><label class="sr-only" for="dictionary-keyword">단어 또는 문법 검색</label><input id="dictionary-keyword" name="keyword" type="search" th:value="${keyword}" placeholder="食べる, たべる, 먹다, ～ように" autocomplete="off"><input type="hidden" name="type" th:value="${type}"><input type="hidden" name="level" th:value="${level}"><input type="hidden" name="category" th:value="${category}"><button type="submit">검색</button></form></header>
    <div class="dictionary-layout">
        <form class="dictionary-filter-form" action="/dictionary" method="get"><input type="hidden" name="keyword" th:value="${keyword}"><details><summary>검색 필터 <span th:if="${type != '' or level != '' or category != ''}">· 적용 중</span></summary><aside class="filter-panel" aria-label="검색 필터">
            <div class="filter-group"><h2>콘텐츠</h2><label class="check-row"><input type="radio" name="type" value="" th:checked="${type == ''}"> 전체</label><label class="check-row"><input type="radio" name="type" value="WORD" th:checked="${type == 'WORD'}"> 단어</label><label class="check-row"><input type="radio" name="type" value="GRAMMAR" th:checked="${type == 'GRAMMAR'}"> 문법</label></div>
            <div class="filter-group"><h2>JLPT</h2><label class="check-row"><input type="radio" name="level" value="" th:checked="${level == ''}"> 전체</label><label class="check-row" th:each="option : ${filterOptions.levels}"><input type="radio" name="level" th:value="${option.code}" th:checked="${level == option.code}"><span th:text="${option.code}">N5</span></label></div>
            <div class="filter-group"><h2>학습 분야</h2><label class="check-row"><input type="radio" name="category" value="" th:checked="${category == ''}"> 전체</label><label class="check-row" th:each="option : ${filterOptions.categories}"><input type="radio" name="category" th:value="${option.slug}" th:checked="${category == option.slug}"><span th:text="${option.name}">일상</span></label></div>
            <div class="dictionary-filter-actions"><button class="button" type="submit">필터 적용</button><a class="button secondary" th:href="@{/dictionary(keyword=${keyword})}">초기화</a></div>
        </aside></details></form>
        <section aria-live="polite"><div class="result-toolbar"><strong th:text="${contentPage.totalElements + '개 결과'}">0개 결과</strong><span>정확한 표기·읽기 일치 우선</span></div>
            <div class="result-list" th:unless="${#lists.isEmpty(contents)}"><a class="result-row" th:each="content : ${contents}" th:href="@{/contents/{slug}(slug=${content.slug})}" th:attr="data-kind=${content.type.name().toLowerCase()}"><span class="result-type" th:text="${content.type.name() == 'WORD' ? '단어' : '문법'}">단어</span><div class="result-term"><strong lang="ja" th:text="${content.title}">食べる</strong><span lang="ja" th:if="${content.reading != null}" th:text="${content.reading}">たべる</span></div><div class="result-meaning" th:text="${content.description}">먹다</div><div class="result-meta"><span class="meta-tag" th:each="lv : ${content.levels}" th:text="${lv.code}">N5</span><span class="meta-tag" th:each="cat : ${content.categories}" th:text="${cat.name}">일상</span></div></a></div>
            <div class="empty-state" th:if="${#lists.isEmpty(contents)}"><h2>일치하는 표현이 없습니다.</h2><p>검색어를 짧게 바꾸거나 선택한 필터를 해제해 보세요.</p><a class="quiet-link" href="/dictionary">전체 콘텐츠 보기</a></div>
            <nav class="pagination" th:if="${contentPage.totalPages > 1}" aria-label="페이지 이동"><a th:if="${contentPage.hasPrevious}" th:href="@{/dictionary(keyword=${keyword},type=${type},level=${level},category=${category},page=${contentPage.page - 1},size=${contentPage.size})}">← 이전</a><span th:text="${contentPage.page + 1 + ' / ' + contentPage.totalPages}">1 / 1</span><a th:if="${contentPage.hasNext}" th:href="@{/dictionary(keyword=${keyword},type=${type},level=${level},category=${category},page=${contentPage.page + 1},size=${contentPage.size})}">다음 →</a></nav>
        </section>
    </div>
</div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
