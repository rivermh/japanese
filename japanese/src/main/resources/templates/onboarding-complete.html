<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('내 학습 플랜')}"></head>
<body class="editorial-page onboarding-page"><header th:replace="~{fragments/layout :: header('onboarding')}"></header>
<main id="main-content" class="page-shell onboarding-shell"><section class="surface plan-confirmation"><p class="eyebrow">PLAN READY</p><h1>오늘부터 차근차근 시작해요.</h1><p class="subtle">복습을 먼저 하고, 새 콘텐츠는 정한 속도로 이어집니다.</p><dl class="metric-strip"><div><dt>학습 JLPT 범위</dt><dd th:text="${#lists.isEmpty(plan.scope.levelCodes) ? '전체' : #strings.listJoin(plan.scope.levelCodes, ', ')}">JLPT:N5</dd></div><div><dt>새 단어</dt><dd th:text="${plan.dailyNewWordLimit + '개'}">5개</dd></div><div><dt>새 문법</dt><dd th:text="${plan.dailyNewGrammarLimit + '개'}">5개</dd></div></dl><div class="toolbar"><a class="button" href="/today">오늘의 학습 시작 →</a><a class="text-link" href="/settings">설정 더 보기</a></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
