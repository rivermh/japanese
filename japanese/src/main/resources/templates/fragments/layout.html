<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ee">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23263248'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='40' fill='%23fffefa'%3E%E6%97%A5%3C/text%3E%3C/svg%3E">
    <title th:text="${title + ' · Japanese'}">Japanese</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/app-v2.css}">
    <script defer th:src="@{/js/character-animator.js}"></script>
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header th:fragment="header(active)" class="app-header" th:classappend="${@currentUserService.isAuthenticated() ? ' is-authenticated' : ' is-guest'}" th:with="signedIn=${@currentUserService.isAuthenticated()},account=${signedIn ? @currentUserService.currentAccount() : null}">
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <div class="app-topbar">
        <div class="topbar-inner">
            <a class="shell-brand" href="/" aria-label="Japanese 홈">Japanese</a>
            <nav class="desktop-nav" th:if="${signedIn}" aria-label="주 메뉴">
                <a href="/" th:classappend="${active == 'home' ? ' active' : ''}" th:attr="aria-current=${active == 'home' ? 'page' : null}">홈</a>
                <a href="/today" th:classappend="${active == 'today' ? ' active' : ''}" th:attr="aria-current=${active == 'today' ? 'page' : null}">오늘</a>
                <a href="/dictionary" th:classappend="${active == 'search' ? ' active' : ''}" th:attr="aria-current=${active == 'search' ? 'page' : null}">사전</a>
                <a href="/study?reviewOnly=true" th:classappend="${active == 'review' or active == 'weaknesses' ? ' active' : ''}" th:attr="aria-current=${active == 'review' or active == 'weaknesses' ? 'page' : null}">복습</a>
                <details class="nav-menu" th:classappend="${active == 'my' or active == 'haru' or active == 'bookmarks' or active == 'queue' or active == 'collections' or active == 'history' or active == 'progress' or active == 'statistics' or active == 'settings' ? ' active' : ''}">
                    <summary>내 학습 <span aria-hidden="true">⌄</span></summary>
                    <div class="nav-menu-panel"><a href="/my-learning">내 학습 홈</a><a href="/haru">Haru</a><a href="/weaknesses">약점노트</a><a href="/bookmarks">저장함</a><a href="/history">학습 기록</a><a href="/report/weekly">주간 리포트</a><a href="/progress">JLPT 진도</a></div>
                </details>
            </nav>
            <strong class="topbar-title" th:if="${signedIn}" th:text="${active == 'home' ? '홈' : active == 'today' ? '오늘' : active == 'search' ? '사전' : (active == 'review' or active == 'weaknesses') ? '복습' : '내 학습'}">Japanese</strong>
            <form class="global-search" action="/dictionary" method="get" role="search"><label class="sr-only" for="global-search">사전 검색</label><input id="global-search" name="keyword" placeholder="일본어 검색"><button type="submit" aria-label="검색">⌕</button></form>
            <details class="profile-menu" th:if="${signedIn}"><summary><span class="avatar" th:text="${#strings.substring(account.displayName,0,1)}">나</span><span th:text="${account.displayName}">학습자</span><span aria-hidden="true">⌄</span></summary><div class="profile-menu-panel"><a href="/settings">학습 설정</a><form action="/logout" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">로그아웃</button></form></div></details>
            <a class="mobile-profile-link" th:if="${signedIn}" href="/settings" aria-label="학습 설정"><span class="avatar" th:text="${#strings.substring(account.displayName,0,1)}">나</span></a>
            <div class="guest-actions" th:unless="${signedIn}"><a class="guest-nav-dictionary" href="/dictionary">사전</a><a class="guest-header-login" href="/login">로그인</a><a class="header-cta" href="/signup">시작하기</a></div>
        </div>
    </div>
    <nav class="mobile-tabbar" th:if="${signedIn}" aria-label="모바일 주 메뉴"><a href="/" th:classappend="${active == 'home' ? ' active' : ''}"><span>⌂</span>홈</a><a href="/today" th:classappend="${active == 'today' ? ' active' : ''}"><span>▣</span>오늘</a><a href="/dictionary" th:classappend="${active == 'search' ? ' active' : ''}"><span>⌕</span>사전</a><a href="/study?reviewOnly=true" th:classappend="${active == 'review' or active == 'weaknesses' ? ' active' : ''}"><span>↻</span>복습</a><a href="/my-learning" th:classappend="${active == 'my' or active == 'haru' or active == 'bookmarks' or active == 'queue' or active == 'collections' or active == 'history' or active == 'progress' or active == 'statistics' or active == 'settings' ? ' active' : ''}"><span>▥</span>내 학습</a></nav>
</header>
<footer th:fragment="footer" class="app-footer"><span>Japanese <span aria-hidden="true">/</span> 매일, 조금씩 더 가까이.</span><nav aria-label="추가 메뉴"><a href="/categories">학습 분야</a><a href="/study">자유 학습</a><a href="/quiz">확인 문제</a></nav></footer>
</body>
</html>
