<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ee">
    <title th:text="${title + ' · Japanese'}">Japanese</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/character-animator.js}"></script>
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header th:fragment="header(active)" class="app-header" th:with="signedIn=${@currentUserService.isAuthenticated()}">
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <div class="nav-shell">
        <a class="brand" href="/" aria-label="Japanese 홈"><span class="brand-mark" aria-hidden="true">日</span><span>Japanese<small>하루를 쌓는 일본어</small></span></a>
        <nav class="primary-nav" aria-label="주 메뉴">
            <a href="/" th:attr="aria-current=${active == 'home' ? 'page' : null}">홈</a>
            <a href="/today" th:if="${signedIn}" th:attr="aria-current=${active == 'today' ? 'page' : null}">오늘의 학습</a>
            <a href="/#library" th:attr="aria-current=${active == 'search' ? 'page' : null}">단어·문법</a>
            <a href="/bookmarks" th:if="${signedIn}" th:attr="aria-current=${active == 'bookmarks' ? 'page' : null}">북마크</a>
            <a href="/study-queue" th:if="${signedIn}" th:attr="aria-current=${active == 'queue' ? 'page' : null}">학습 목록</a>
            <a href="/collections" th:if="${signedIn}" th:attr="aria-current=${active == 'collections' ? 'page' : null}">단어장</a>
            <a href="/history" th:if="${signedIn}" th:attr="aria-current=${active == 'history' ? 'page' : null}">기록</a>
            <a href="/progress" th:if="${signedIn}" th:attr="aria-current=${active == 'progress' ? 'page' : null}">진도</a>
            <a href="/statistics" th:if="${signedIn}" th:attr="aria-current=${active == 'statistics' ? 'page' : null}">통계</a>
        </nav>
        <div class="account-nav" th:if="${signedIn}">
            <a href="/settings" th:attr="aria-current=${active == 'settings' ? 'page' : null}">설정</a>
            <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button-quiet" type="submit">로그아웃</button></form>
        </div>
        <div class="account-nav" th:unless="${signedIn}"><a href="/login">로그인</a><a class="button button-small" href="/signup">시작하기</a></div>
    </div>
</header>
<footer th:fragment="footer" class="app-footer"><span>Japanese <span aria-hidden="true">/</span> 매일, 조금씩 더 가까이.</span><nav aria-label="추가 메뉴"><a href="/categories">학습 분야</a><a href="/study">자유 학습</a><a href="/quiz">확인 문제</a></nav></footer>
</body>
</html>
