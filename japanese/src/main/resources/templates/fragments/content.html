<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="lessonBody(content)" class="learning-body">
    <dl class="inline-facts" th:if="${content.partOfSpeech != null or (content.pitchAccentDisplay != null and !content.pitchAccentDisplay.rawOnly)}">
        <div th:if="${content.partOfSpeech != null}"><dt>품사</dt><dd th:text="${content.partOfSpeech}"></dd></div>
        <div th:if="${content.pitchAccentDisplay != null and !content.pitchAccentDisplay.rawOnly}"><dt>피치 악센트</dt><dd th:text="${content.pitchAccentDisplay.label}"></dd></div>
    </dl>
    <details class="source-disclosure" th:if="${content.pitchAccentDisplay != null and content.pitchAccentDisplay.rawOnly}"><summary th:text="${content.pitchAccentDisplay.label}">원본 피치 악센트 표기</summary><p class="subtle">원본 형식의 의미를 확정할 수 없어 변환하지 않았습니다.</p><p class="subtle" th:text="${content.pitchAccent}"></p></details>
    <section class="detail-section" th:if="${content.summary.type.name() == 'WORD' and !#lists.isEmpty(content.meaningGroups)}"><h2>의미</h2><ol class="meaning-list"><li th:each="group : ${content.meaningGroups}"><strong th:text="${group.meaning.text}"></strong><div class="example-list meaning-example-list" th:if="${!#lists.isEmpty(group.examples)}"><article class="example" th:each="example : ${group.examples}"><p class="example-japanese" lang="ja" th:text="${example.japaneseText}"></p><p class="example-reading" lang="ja" th:if="${example.reading != null and !example.reading.isBlank()}" th:text="${example.reading}"></p><p class="example-translation" th:if="${example.translation != null and !example.translation.isBlank()}" th:text="${example.translation}"></p></article></div></li></ol></section>
    <section class="detail-section" th:if="${content.grammar != null}"><h2>핵심 의미와 설명</h2><p class="prose" th:text="${content.grammar.explanation}"></p><h3 class="label-heading" th:if="${content.grammar.connection != null and !content.grammar.connection.isBlank()}">접속</h3><p class="connection" th:if="${content.grammar.connection != null and !content.grammar.connection.isBlank()}" th:text="${content.grammar.connection}"></p></section>
    <section class="detail-section grammar-enrichment" th:if="${content.grammar != null and content.grammar.learning.enrichment != null}"><h2>학습 보강</h2><div th:if="${content.grammar.learning.enrichment.usageNote != null and !content.grammar.learning.enrichment.usageNote.isBlank()}"><h3 class="label-heading">어떤 상황에서 쓰나요</h3><p class="prose" th:text="${content.grammar.learning.enrichment.usageNote}"></p></div><div th:if="${content.grammar.learning.enrichment.nuance != null and !content.grammar.learning.enrichment.nuance.isBlank()}"><h3 class="label-heading">뉘앙스</h3><p class="prose" th:text="${content.grammar.learning.enrichment.nuance}"></p></div><div th:if="${content.grammar.learning.enrichment.formationSupplement != null and !content.grammar.learning.enrichment.formationSupplement.isBlank()}"><h3 class="label-heading">접속 보충</h3><p class="prose" th:text="${content.grammar.learning.enrichment.formationSupplement}"></p></div><div th:if="${content.grammar.learning.enrichment.commonMistake != null and !content.grammar.learning.enrichment.commonMistake.isBlank()}"><h3 class="label-heading">자주 하는 실수</h3><p class="prose" th:text="${content.grammar.learning.enrichment.commonMistake}"></p></div><div th:if="${content.grammar.learning.enrichment.learnerNote != null and !content.grammar.learning.enrichment.learnerNote.isBlank()}"><h3 class="label-heading">학습 메모</h3><p class="prose" th:text="${content.grammar.learning.enrichment.learnerNote}"></p></div></section>
    <section class="detail-section" th:if="${content.summary.type.name() == 'WORD' and !#lists.isEmpty(content.unlinkedExamples)}"><div class="section-heading"><h2>의미와 연결되지 않은 예문</h2><span class="count" th:text="${content.unlinkedExamples.size() + '개 예문'}"></span></div><div class="example-list"><article class="example" th:each="example : ${content.unlinkedExamples}"><p class="example-japanese" lang="ja" th:text="${example.japaneseText}"></p><p class="example-reading" lang="ja" th:if="${example.reading != null and !example.reading.isBlank()}" th:text="${example.reading}"></p><p class="example-translation" th:if="${example.translation != null and !example.translation.isBlank()}" th:text="${example.translation}"></p></article></div></section>
    <section class="detail-section" th:if="${content.summary.type.name() == 'GRAMMAR' and !#lists.isEmpty(content.examples)}"><div class="section-heading"><h2>문장으로 익히기</h2><span class="count" th:text="${content.examples.size() + '개 예문'}"></span></div><div class="example-list"><article class="example" th:each="example : ${content.examples}"><p class="example-japanese" lang="ja" th:text="${example.japaneseText}"></p><p class="example-reading" lang="ja" th:if="${example.reading != null and !example.reading.isBlank()}" th:text="${example.reading}"></p><p class="example-translation" th:if="${example.translation != null and !example.translation.isBlank()}" th:text="${example.translation}"></p></article></div></section>
    <section class="detail-section grammar-related" th:if="${content.grammar != null and !#lists.isEmpty(content.grammar.learning.related)}"><h2>비슷하거나 헷갈리는 문법</h2><div class="related-grammar-list"><article th:each="related : ${content.grammar.learning.related}"><div><strong lang="ja" th:text="${related.pattern}"></strong><span class="status-pill" th:text="${related.relationType}"></span><p th:text="${related.explanation}"></p></div><a class="text-link" th:if="${related.comparisonAvailable}" th:href="@{/grammars/{slug}/compare/{other}(slug=${content.summary.slug},other=${related.slug})}">비교하기</a><a class="text-link" th:unless="${related.comparisonAvailable}" th:href="@{/contents/{slug}(slug=${related.slug})}">상세 보기</a></article></div></section>
</div>
<details th:fragment="source(content)" class="source-disclosure" th:if="${content.source != null}"><summary>출처 및 이용 안내 <span th:text="${content.source.displayName}"></span></summary><div class="source-card"><strong th:text="${content.source.displayName + (content.source.version != null ? ' ' + content.source.version : '')}"></strong><p th:text="${content.source.licenseSummary}"></p><p th:text="${content.source.attribution}"></p><p th:text="${content.source.usageNote}"></p><a th:if="${content.source.licenseUrl != null}" th:href="${content.source.licenseUrl}" target="_blank" rel="noreferrer">라이선스 원문 보기</a></div></details>
</body></html>
