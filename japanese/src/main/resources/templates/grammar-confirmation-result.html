<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('문법 이해 확인 결과')}"></head>
<body class="editorial-page grammar-check-page">
<header th:replace="~{fragments/layout :: header('my')}"></header>
<main id="main-content" class="page-shell detail-shell">
    <article class="surface lesson-paper confirmation-result">
        <p class="eyebrow" th:text="${result.correct ? 'CHECK COMPLETE' : 'READ ONCE MORE'}"></p>
        <h1 th:text="${result.correct ? '맞았습니다.' : '다시 확인해 보세요.'}"></h1>
        <p class="prose" th:text="${'정답: ' + result.correctChoice}"></p>
        <p class="prose" th:if="${result.explanation != null and !result.explanation.isBlank()}" th:text="${result.explanation}"></p>
        <p class="subtle">이 확인은 보조 학습 기록으로만 남으며 EXP와 오늘 목표는 증가하지 않습니다.</p>
        <div class="toolbar"><a class="button" th:href="@{/contents/{slug}(slug=${result.grammarSlug})}"><span lang="ja" th:text="${result.grammarPattern}"></span> 상세로</a><a class="button-secondary" href="/today">오늘 학습</a></div>
    </article>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
