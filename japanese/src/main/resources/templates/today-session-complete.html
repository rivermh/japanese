<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('오늘 학습 결과')}"></head><body><header th:replace="~{fragments/layout :: header('today')}"></header><main id="main-content" class="page-shell"><section class="surface completion-panel"><div class="completion-seal">✓</div><div><p class="eyebrow">SESSION COMPLETE</p><h1>오늘의 학습을 마쳤어요.</h1><p class="subtle">정규 학습 결과는 실제 학습 기록을 기준으로 계산됩니다.</p></div><dl class="metric-strip"><div><dt>새 단어</dt><dd th:text="${todayReport.newWordCount + '개'}">0개</dd></div><div><dt>새 문법</dt><dd th:text="${todayReport.newGrammarCount + '개'}">0개</dd></div><div><dt>복습</dt><dd th:text="${todayReport.reviewCount + '개'}">0개</dd></div><div><dt>다시 보기</dt><dd th:text="${todayReport.incorrectCount + '개'}">0개</dd></div><div><dt>획득 EXP</dt><dd th:text="${todayReport.earnedExperience + ' EXP'}">0 EXP</dd></div><div><dt>연속 학습</dt><dd th:text="${todayReport.currentStreak + '일'}">0일</dd></div></dl><p class="subtle" th:text="${'오늘 목표 ' + todayReport.regularGoalCompleted + ' / ' + todayReport.dailyGoal + ' · 남은 복습 ' + todayReport.remainingDueReviewCount + '개 · 내일 예정 ' + todayReport.tomorrowReviewCount + '개'}"></p><div class="toolbar"><a class="button" href="/">홈으로</a><a class="button button-secondary" th:if="${todayReport.remainingDueReviewCount > 0}" href="/study?reviewOnly=true">남은 복습 보기</a><a class="text-link" href="/history">학습 기록 보기</a></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
