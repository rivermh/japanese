<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('오늘 학습 결과')}"></head>
<body class="study-mode">
<header th:replace="~{fragments/layout :: header('today')}"></header>
<main id="main-content" class="page-shell today-study-shell">
    <section class="today-complete">
        <div class="completion-intro">
            <div>
                <p class="eyebrow">SESSION COMPLETE</p>
                <h1>오늘의 학습을 마쳤어요.</h1>
                <p class="subtle">실제 StudyRecord를 기준으로 오늘 결과를 정리했습니다. 확인 문제를 풀지 않아도 학습은 완료됩니다.</p>
            </div>
        </div>
        <dl class="completion-summary">
            <div><dt>새 단어</dt><dd th:text="${todayReport.newWordCount + '개'}">0개</dd></div>
            <div><dt>새 문법</dt><dd th:text="${todayReport.newGrammarCount + '개'}">0개</dd></div>
            <div><dt>복습</dt><dd th:text="${todayReport.reviewCount + '개'}">0개</dd></div>
            <div><dt>다시 보기</dt><dd th:text="${todayReport.incorrectCount + '개'}">0개</dd></div>
            <div><dt>획득 EXP</dt><dd th:text="${todayReport.earnedExperience + ' EXP'}">0 EXP</dd></div>
            <div><dt>연속 학습</dt><dd th:text="${todayReport.currentStreak + '일'}">0일</dd></div>
        </dl>
        <div class="completion-followup">
            <div><span>오늘 목표</span><strong th:text="${todayReport.regularGoalCompleted + ' / ' + todayReport.dailyGoal}"></strong></div>
            <div><span>남은 backlog</span><strong th:text="${todayReport.remainingDueReviewCount + '개'}"></strong></div>
            <div><span>내일 복습 예정</span><strong th:text="${todayReport.tomorrowReviewCount + '개'}"></strong></div>
        </div>
        <div class="toolbar">
            <a class="button" href="/">홈으로 돌아가기</a>
            <a class="button-secondary" th:if="${todayReport.remainingDueReviewCount > 0}" href="/study?reviewOnly=true">남은 복습 보기</a>
            <a class="quiet-link" href="/quiz">선택: 확인 문제</a>
            <a class="quiet-link" href="/history">학습 기록</a>
        </div>
    </section>
</main>
</body>
</html>
