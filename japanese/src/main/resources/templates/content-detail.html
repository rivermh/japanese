<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${content.summary.title})}"></head>
<body><header th:replace="~{fragments/layout :: header('search')}"></header>
<main id="main-content" class="page-shell detail-shell">
    <div class="breadcrumb"><a href="/#library">단어·문법</a><span aria-hidden="true">/</span><span th:text="${content.summary.type.name() == 'WORD' ? '단어' : '문법'}"></span></div>
    <article class="surface lesson-paper">
        <header class="lesson-heading"><div><div class="card-meta"><span class="type-pill" th:text="${content.summary.type.name() == 'WORD' ? '단어' : '문법'}"></span><span th:each="level : ${content.summary.levels}" class="level-pill" th:text="${level.system + ' ' + level.code}"></span><span class="status-pill" th:if="${learningStatus != null}" th:text="${learningStatus.label}"></span></div><h1 lang="ja" th:text="${content.summary.title}"></h1><p class="reading" lang="ja" th:if="${content.summary.reading != null}" th:text="${content.summary.reading}"></p></div>
        <div class="detail-actions" th:if="${authenticated}">
            <form th:action="@{/contents/{slug}/bookmark(slug=${content.summary.slug})}" method="post"><input type="hidden" name="returnTo" th:value="${'/contents/' + content.summary.slug}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button-secondary" type="submit" th:attr="aria-pressed=${bookmarked}" th:text="${bookmarked ? '✓ 북마크 해제' : '＋ 북마크 저장'}"></button></form>
            <form th:if="${queueStatus.queued}" th:action="@{/contents/{slug}/study-queue/remove(slug=${content.summary.slug})}" method="post"><input type="hidden" name="returnTo" th:value="${'/contents/' + content.summary.slug}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button-secondary" type="submit">학습 목록에서 제거</button></form>
            <form th:if="${!queueStatus.queued and queueStatus.canAdd}" th:action="@{/contents/{slug}/study-queue(slug=${content.summary.slug})}" method="post"><input type="hidden" name="returnTo" th:value="${'/contents/' + content.summary.slug}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">학습 목록에 추가</button></form>
            <span class="status-pill" th:if="${!queueStatus.queued and !queueStatus.canAdd}" th:text="${queueStatus.label}"></span>
        </div><a class="button button-secondary" th:unless="${authenticated}" href="/login">로그인하고 저장</a></header>
        <form class="compact-add-form" th:if="${authenticated and !#lists.isEmpty(collections)}" method="post" th:action="@{/collections/add/{slug}(slug=${content.summary.slug})}">
            <input type="hidden" name="returnTo" th:value="${'/contents/' + content.summary.slug}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="collection-select">내 단어장에 추가</label><select id="collection-select" name="collectionId"><option th:each="collection : ${collections}" th:value="${collection.id}" th:text="${collection.name}"></option></select><button class="button-quiet" type="submit">추가</button><a class="text-link" href="/collections">관리</a>
        </form>
        <div th:replace="~{fragments/content :: lessonBody(${content})}"></div>
        <div class="toolbar" th:if="${authenticated and content.grammar != null and content.grammar.learning.confirmationAvailable}"><a class="button-secondary" th:href="@{/grammars/{slug}/confirm(slug=${content.summary.slug})}">문법 이해 확인</a></div>
        <div class="tag-row detail-tags"><a th:each="category : ${content.summary.categories}" th:href="@{/(category=${category.slug})} + '#library'" th:text="${category.name}"></a></div>
        <div th:replace="~{fragments/content :: source(${content})}"></div>
    </article>
    <div class="reading-footer"><p class="subtle">표현을 익혔다면, 오늘의 학습을 이어가세요.</p><a class="button" href="/today">오늘의 학습 →</a></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
