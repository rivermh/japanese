<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${content.summary.title})}"></head>
<body class="editorial-page dictionary-detail-page"><header th:replace="~{fragments/layout :: header('search')}"></header>
<main id="main-content" class="page-shell detail-shell">
    <div class="breadcrumb"><a href="/dictionary">사전</a><span aria-hidden="true">/</span><span th:text="${content.summary.type.name() == 'WORD' ? '단어 상세' : '문법 상세'}"></span></div>
    <article class="lesson-paper">
        <header class="lesson-heading"><div><div class="card-meta"><span th:text="${content.summary.type.name() == 'WORD' ? '단어' : '문법'}"></span><span th:each="level : ${content.summary.levels}" th:text="${level.system + ' ' + level.code}"></span><span th:if="${learningStatus != null}" th:text="${learningStatus.label}"></span></div><h1><span th:replace="~{fragments/content :: headword(${content.summary.title}, ${content.summary.reading}, ${content.summary.type})}">食べる</span></h1><p class="reading" lang="ja" th:if="${content.summary.type.name() != 'WORD' and content.summary.reading != null}" th:text="${content.summary.reading}"></p></div></header>
        <div th:replace="~{fragments/content :: lessonBody(${content})}"></div>
        <div class="tag-row detail-tags" th:if="${!#lists.isEmpty(content.summary.categories)}"><a th:each="category : ${content.summary.categories}" th:href="@{/dictionary(category=${category.slug})}" th:text="${category.name}"></a></div>
        <div th:replace="~{fragments/content :: source(${content})}"></div>
    </article>
    <aside class="reading-footer detail-action-rail" aria-label="학습 및 저장">
        <section><h2>학습 상태</h2><p th:if="${learningStatus != null}" th:text="${learningStatus.label}"></p><p th:unless="${learningStatus != null}">로그인하면 학습 상태를 확인할 수 있습니다.</p></section>
        <div class="detail-actions" th:if="${authenticated}">
            <form th:if="${queueStatus.queued}" th:action="@{/contents/{slug}/study-queue/remove(slug=${content.summary.slug})}" method="post"><input type="hidden" name="returnTo" th:value="${'/contents/' + content.summary.slug}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button-secondary" type="submit">학습 목록에서 제거</button></form>
            <form th:if="${!queueStatus.queued and queueStatus.canAdd}" th:action="@{/contents/{slug}/study-queue(slug=${content.summary.slug})}" method="post"><input type="hidden" name="returnTo" th:value="${'/contents/' + content.summary.slug}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">학습 목록에 추가</button></form>
            <span class="status-pill" th:if="${!queueStatus.queued and !queueStatus.canAdd}" th:text="${queueStatus.label}"></span>
            <form th:action="@{/contents/{slug}/bookmark(slug=${content.summary.slug})}" method="post"><input type="hidden" name="returnTo" th:value="${'/contents/' + content.summary.slug}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button-secondary" type="submit" th:attr="aria-pressed=${bookmarked}" th:text="${bookmarked ? '북마크 해제' : '북마크 저장'}"></button></form>
        </div>
        <form class="compact-add-form" th:if="${authenticated and !#lists.isEmpty(collections)}" method="post" th:action="@{/collections/add/{slug}(slug=${content.summary.slug})}"><input type="hidden" name="returnTo" th:value="${'/contents/' + content.summary.slug}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="collection-select">내 단어장</label><select id="collection-select" name="collectionId"><option th:each="collection : ${collections}" th:value="${collection.id}" th:text="${collection.name}"></option></select><button class="button-secondary" type="submit">추가</button></form>
        <a class="button button-secondary" th:unless="${authenticated}" href="/login">로그인하고 저장</a>
        <a class="button-secondary" th:if="${authenticated and content.grammar != null and content.grammar.learning.confirmationAvailable}" th:href="@{/grammars/{slug}/confirm(slug=${content.summary.slug})}">문법 이해 확인</a>
        <a class="button" th:if="${authenticated}" href="/today">오늘의 학습 이어가기</a>
        <p class="detail-readonly-note">상세 조회만으로 EXP, 목표, Streak는 변경되지 않습니다.</p>
    </aside>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
