<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('확인 문제')}"></head>
<body class="editorial-page quiz-hub-page">
<header th:replace="~{fragments/layout :: header('my')}"></header>
<main id="main-content" class="page-shell quiz-hub-shell">
    <header class="page-heading"><div><p class="eyebrow">QUICK CHECK</p><h1>짧게 확인하는 일본어</h1><p class="subtle">학습한 표현을 다섯 문제로 가볍게 점검해 보세요.</p></div></header>

    <section class="quiz-hub-intro" aria-labelledby="quiz-hub-title">
        <div><p class="section-label">빠른 퀴즈</p><h2 id="quiz-hub-title">한 번에 한 문제씩 집중해요.</h2><p>정규 복습과 분리된 확인 활동이며, 결과는 학습 기록에 남습니다.</p></div>
        <form th:if="${@currentUserService.isAuthenticated()}" action="/quiz/start" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">퀴즈 시작 · 5문제</button></form>
        <a class="button" th:unless="${@currentUserService.isAuthenticated()}" href="/login">로그인하고 시작</a>
    </section>

    <section class="quiz-level-picker" aria-labelledby="quiz-level-title">
        <div><h2 id="quiz-level-title">JLPT 레벨</h2><p>원하는 레벨의 개별 문제를 골라 풀 수도 있습니다.</p></div>
        <nav class="quiz-levels" aria-label="JLPT 레벨"><a th:classappend="${level == '' ? ' active' : ''}" href="/quiz">전체</a><a th:each="code : ${ {'N5','N4','N3','N2','N1'} }" th:classappend="${level == code ? ' active' : ''}" th:href="@{/quiz(level=${code})}" th:text="${code}">N5</a></nav>
    </section>

    <details class="quiz-library">
        <summary><span>개별 문제 고르기</span><small th:text="${questions.totalElements + '개 문제'}">0개 문제</small></summary>
        <div class="editorial-list" th:unless="${#lists.isEmpty(questions.questions)}">
            <a class="editorial-row quiz-library-row" th:each="question : ${questions.questions}" th:href="@{/quiz/{id}(id=${question.id})}">
                <span class="type-pill" th:text="${question.questionType}">어휘</span>
                <span class="editorial-row-main"><strong th:text="${question.label != '' ? question.label : question.promptJapanese}">문제</strong><small th:text="${question.promptKorean}">문제를 풀어보세요.</small></span>
                <span class="level-pill" th:text="${question.level}">N5</span>
                <span aria-hidden="true">→</span>
            </a>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(questions.questions)}"><h2>지금은 확인 문제가 없어요.</h2><p>단어와 문법 학습은 계속할 수 있습니다.</p><a class="text-link" href="/today">오늘 학습으로</a></div>
        <nav class="pagination" th:if="${questions.totalPages > 1}" aria-label="문제 페이지"><a th:if="${questions.hasPrevious}" th:href="@{/quiz(level=${level},page=${questions.page - 1})}">← 이전</a><span th:text="${questions.page + 1 + ' / ' + questions.totalPages}">1 / 1</span><a th:if="${questions.hasNext}" th:href="@{/quiz(level=${level},page=${questions.page + 1})}">다음 →</a></nav>
    </details>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
