<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body class="login-page">
<header class="app-header login-header">
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <a class="login-home" th:href="@{/}" aria-label="Japanese 홈">Japanese</a>
    <nav aria-label="비회원 메뉴">
        <a th:href="@{/dictionary}">사전</a>
        <a th:href="@{/login}" aria-current="page">로그인</a>
        <a th:href="@{/signup}">회원가입</a>
    </nav>
</header>
<main id="main-content" class="login-layout">
    <section class="login-welcome" aria-labelledby="welcome-title">
        <p class="login-brand">Japanese</p>
        <h1 id="welcome-title">오늘도 천천히<br>이어가요.</h1>
        <p class="login-description">학습 기록과 오늘의 복습이 기다리고 있어요.</p>
    </section>
    <section class="login-panel" aria-labelledby="login-title" th:with="loginFailed=${param.error != null}">
        <p class="form-message success" role="status" th:if="${param.accountDeleted != null}">계정이 삭제되었습니다.</p>
        <h2 id="login-title">로그인</h2>
        <p id="login-error" class="form-message" role="alert" th:if="${param.error != null}">로그인 ID 또는 비밀번호를 확인하세요.</p>
        <p class="form-message success" role="status" th:if="${signupMessage != null}" th:text="${signupMessage}">가입 완료</p>
        <form class="auth-form" th:action="@{/login}" method="post" th:attr="aria-describedby=${loginFailed ? 'login-error' : null}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="username">로그인 ID</label>
                <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <p class="login-recovery"><a th:href="@{/forgot-password}">비밀번호를 잊으셨나요?</a></p>
            <button class="button login-submit" type="submit">로그인</button>
        </form>
        <p class="login-signup">처음이신가요? <a th:href="@{/signup}">회원가입</a></p>
        <p class="login-browse"><a th:href="@{/dictionary}">사전 먼저 둘러보기 <span aria-hidden="true">→</span></a></p>
    </section>
</main>
</body>
</html>
