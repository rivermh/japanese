<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('home')}"></header>
<main id="main-content" class="page-shell auth-shell">
    <header class="page-heading">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>이어서 공부해 볼까요?</h1>
        <p class="subtle">로그인하고 나의 학습 기록과 복습 일정을 확인하세요.</p>
    </header>
    <section class="surface detail-section" aria-labelledby="login-title">
        <div class="section-heading"><h2 id="login-title">로그인</h2></div>
        <p class="form-message" role="alert" th:if="${param.error != null}">로그인 ID 또는 비밀번호를 확인하세요.</p>
        <p class="form-message success" role="status" th:if="${signupMessage != null}" th:text="${signupMessage}">가입 완료</p>
        <form class="auth-form" th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field">
                <label for="username">로그인 ID</label>
                <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="button" type="submit">로그인</button>
        </form>
        <p class="auth-assist"><a th:href="@{/forgot-password}">비밀번호를 잊으셨나요?</a></p>
        <p class="auth-switch subtle">처음 오셨나요? <a th:href="@{/signup}">회원 가입</a></p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
