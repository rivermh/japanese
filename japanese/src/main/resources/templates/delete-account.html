<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('계정 삭제')}"></head>
<body class="editorial-page settings-page">
<header th:replace="~{fragments/layout :: header('settings')}"></header>
<main id="main-content" class="page-shell auth-shell">
    <header class="page-heading">
        <p class="eyebrow">DELETE ACCOUNT</p>
        <h1>계정을 삭제할까요?</h1>
        <p class="subtle">이 작업은 되돌릴 수 없습니다.</p>
    </header>
    <section class="surface destructive-confirmation" aria-labelledby="delete-warning-title">
        <h2 id="delete-warning-title">삭제되는 정보</h2>
        <p>학습 진도와 기록, Today·Quiz 세션, 북마크, 내 학습 목록과 설정이 영구적으로 삭제됩니다.</p>
        <p>공개 학습 콘텐츠와 다른 사용자의 정보는 삭제되지 않습니다.</p>
        <p class="form-message" role="alert" th:if="${deleteAccountError != null}" th:text="${deleteAccountError}"></p>
        <form class="auth-form" th:action="@{/settings/delete-account}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="field"><label for="currentPassword">현재 비밀번호</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div>
            <button class="button reject-button" type="submit">모든 학습 데이터와 계정 삭제</button>
        </form>
        <p><a class="button-quiet" href="/settings">취소하고 설정으로 돌아가기</a></p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
