<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('오답·약점 노트')}"></head>
<body class="editorial-page weakness-page">
<header th:replace="~{fragments/layout :: header('weaknesses')}"></header>
<main id="main-content" class="page-shell weakness-shell">
    <header class="page-heading">
        <div><p class="eyebrow">WEAKNESS NOTE</p><h1>오답·약점 노트</h1><p class="subtle">최근 30일의 SRS 학습과 문법 확인 문제 기록을 함께 봅니다.</p></div>
        <form th:if="${notebook.availableForFocusedReview > 0}" th:action="@{/weaknesses/session/start}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">집중 재학습 시작 <span th:text="${notebook.availableForFocusedReview + '개'}">10개</span></button></form>
        <a th:if="${activeSession != null and !activeSession.completed}" class="button button-secondary" href="/weaknesses/session">이어하기</a>
    </header>

    <section class="weakness-section" th:if="${!#lists.isEmpty(notebook.recent)}">
        <div class="section-heading"><div><h2>최근 틀린 항목</h2><span class="subtle">마지막 학습 신호가 오답인 콘텐츠</span></div></div>
        <div class="weakness-list" th:replace="~{fragments/weakness :: rows(${notebook.recent})}"></div>
    </section>
    <section class="weakness-section" th:if="${!#lists.isEmpty(notebook.frequent)}">
        <div class="section-heading"><div><h2>자주 틀린 항목</h2><span class="subtle">최근 30일에 두 번 이상 오답</span></div></div>
        <div class="weakness-list" th:replace="~{fragments/weakness :: rows(${notebook.frequent})}"></div>
    </section>
    <section class="weakness-section" th:if="${!#lists.isEmpty(notebook.consecutive)}">
        <div class="section-heading"><div><h2>연속으로 틀린 항목</h2><span class="subtle">가장 최근 정답 이후 오답이 이어진 콘텐츠</span></div></div>
        <div class="weakness-list" th:replace="~{fragments/weakness :: rows(${notebook.consecutive})}"></div>
    </section>
    <section class="weakness-section" th:if="${!#lists.isEmpty(notebook.improving)}">
        <div class="section-heading"><div><h2>개선된 약점</h2><span class="subtle">반복 오답 뒤에 정답 기록이 쌓인 콘텐츠</span></div></div>
        <div class="weakness-list" th:replace="~{fragments/weakness :: rows(${notebook.improving})}"></div>
    </section>
    <section class="empty-state" th:if="${#lists.isEmpty(notebook.recent) and #lists.isEmpty(notebook.improving)}"><h2>아직 정리할 약점이 없습니다.</h2><p>학습과 문법 확인 문제에서 실제 오답이 생기면 이곳에 근거와 함께 표시됩니다.</p><a class="text-link" href="/today">오늘의 학습 시작</a></section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body></html>
