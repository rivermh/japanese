<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('약점 집중 재학습')}"></head><body><header th:replace="~{fragments/layout :: header('weaknesses')}"></header>
<main id="main-content" class="page-shell lesson-shell"><header class="page-heading"><div><p class="eyebrow">FOCUSED RETRAIN</p><h1>약점 집중 재학습</h1><p class="subtle">복습 일정과 연속 학습에는 반영되지만 EXP와 오늘의 정규 목표에는 반영되지 않습니다.</p></div><a class="text-link" href="/weaknesses">약점 노트</a></header>
<section class="session-toolbar" aria-label="집중 재학습 진행"><div class="session-goal"><div class="progress-label"><strong th:text="${weaknessSession.currentNumber + ' / ' + weaknessSession.totalCount}">1 / 10</strong><span th:text="${weaknessSession.remainingCount + '개 남음'}">9개 남음</span></div><progress th:value="${weaknessSession.completedCount}" th:max="${weaknessSession.totalCount}">0</progress></div><p class="subtle">현재 약점 근거가 있는 항목을 고정 순서로 이어서 학습합니다.</p></section>
<article class="surface session-card"><header class="lesson-heading"><div><div class="tag-row"><span class="type-pill">집중 재학습</span><span class="type-pill" th:text="${lesson.summary.type.name() == 'WORD' ? '단어' : '문법'}">단어</span><span class="level-pill" th:each="level : ${lesson.summary.levels}" th:text="${level.system + ' ' + level.code}"></span></div><h2 lang="ja" th:text="${lesson.summary.title}">食べる</h2><p class="reading" lang="ja" th:if="${lesson.summary.reading != null}" th:text="${lesson.summary.reading}">たべる</p></div><span class="count" th:text="${'카드 ' + weaknessSession.currentNumber + ' / ' + weaknessSession.totalCount}">카드 1 / 10</span></header><div class="lesson-paper" th:replace="~{fragments/content :: lessonBody(${lesson})}"></div><div class="lesson-actions"><form th:action="@{/weaknesses/session/{slug}/complete(slug=${lesson.summary.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="result" value="CORRECT"><button type="submit">기억하고 있어요 · 다음</button></form><form th:action="@{/weaknesses/session/{slug}/complete(slug=${lesson.summary.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="result" value="INCORRECT"><button class="button-secondary" type="submit">다시 볼게요</button></form><a class="text-link" th:href="@{/contents/{slug}(slug=${lesson.summary.slug})}">상세 보기</a></div></article>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
