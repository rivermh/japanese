<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('약점 집중 재학습')}"></head>
<body class="review-focus-mode">
<main id="main-content" class="page-shell retrain-shell">
    <header class="retrain-header">
        <a class="study-exit" href="/weaknesses">← 약점 노트로</a>
        <div class="study-progress"><div class="study-progress-copy"><strong th:text="${weaknessSession.currentNumber + ' / ' + weaknessSession.totalCount}">1 / 10</strong><span th:text="${weaknessSession.remainingCount + '개 남음'}">9개 남음</span></div><div class="progress-track" role="progressbar" aria-label="약점 재학습 진행" aria-valuemin="0" th:attr="aria-valuemax=${weaknessSession.totalCount},aria-valuenow=${weaknessSession.completedCount}"><span class="progress-fill" th:style="${'--value:' + (weaknessSession.totalCount == 0 ? 0 : weaknessSession.completedCount * 100 / weaknessSession.totalCount) + '%'}"></span></div></div>
        <span>집중 재학습</span>
    </header>
    <article class="review-focus-card retrain-card">
        <div class="card-meta"><span>FOCUSED RETRAIN</span><span th:text="${lesson.summary.type.name() == 'WORD' ? '단어' : '문법'}">단어</span><span th:each="level : ${lesson.summary.levels}" th:text="${level.system + ' ' + level.code}">JLPT N5</span></div>
        <div class="review-focus-prompt"><h1 lang="ja" th:text="${lesson.summary.title}">食べる</h1><p>뜻을 먼저 떠올려보세요.</p></div>
        <details class="recall-reveal">
            <summary>답 보기</summary>
            <div class="recall-answer">
                <header><h2 lang="ja" th:text="${lesson.summary.title}">食べる</h2><p class="reading" lang="ja" th:if="${lesson.summary.reading != null}" th:text="${lesson.summary.reading}">たべる</p></header>
                <p class="recall-meaning" th:if="${lesson.summary.type.name() == 'WORD' and !#lists.isEmpty(lesson.meanings)}" th:text="${lesson.meanings[0].text}">먹다</p>
                <p class="recall-meaning" th:if="${lesson.summary.type.name() == 'WORD' and #lists.isEmpty(lesson.meanings)}" th:text="${lesson.summary.description}">핵심 의미</p>
                <p class="recall-meaning" th:if="${lesson.grammar != null}" th:text="${lesson.grammar.explanation}">문법 설명</p>
                <article class="recall-example" th:each="example, stat : ${lesson.examples}" th:if="${stat.index < 1}"><p lang="ja" th:text="${example.japaneseText}">例文</p><p th:if="${example.translation != null}" th:text="${example.translation}">예문 번역</p></article>
                <a class="text-link" th:href="@{/contents/{slug}(slug=${lesson.summary.slug})}">상세 보기</a>
            </div>
            <div class="recall-grade" aria-label="복습 결과 선택">
                <form th:action="@{/weaknesses/session/{slug}/complete(slug=${lesson.summary.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="result" value="INCORRECT"><button class="button-secondary" type="submit">다시 볼게요</button></form>
                <form th:action="@{/weaknesses/session/{slug}/complete(slug=${lesson.summary.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="result" value="CORRECT"><button class="button" type="submit">기억했어요</button></form>
            </div>
        </details>
    </article>
    <p class="retrain-note">복습 일정과 연속 학습에는 반영되며, EXP와 오늘 목표에는 포함되지 않습니다.</p>
</main>
</body>
</html>
