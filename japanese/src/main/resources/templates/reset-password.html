<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('새 비밀번호')}"></head>
<body class="editorial-page secondary-auth-page"><header th:replace="~{fragments/layout :: header('home')}"></header>
<main id="main-content" class="page-shell auth-shell">
  <header class="page-heading"><p class="eyebrow">NEW PASSWORD</p><h1>새 비밀번호를 입력하세요</h1></header>
  <section class="surface detail-section">
    <p class="form-message" role="alert" th:if="${accountError != null}" th:text="${accountError}"></p>
    <div th:if="${tokenUsable}"><form class="auth-form" th:action="@{/reset-password}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="token" th:value="${token}">
      <div class="field"><label for="password">새 비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><p class="subtle">8~72자로 입력하세요.</p></div>
      <div class="field"><label for="passwordConfirmation">새 비밀번호 확인</label><input id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
      <button class="button" type="submit">비밀번호 변경</button>
    </form></div>
    <div class="account-result" th:unless="${tokenUsable}"><h2>사용할 수 없는 링크입니다</h2><p class="subtle">링크가 잘못되었거나 만료되었거나 이미 사용되었습니다.</p><a class="button-secondary" th:href="@{/forgot-password}">새 링크 요청하기</a></div>
  </section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
