<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('빠른 퀴즈 결과')}"></head>
<body class="editorial-page quiz-result-page">
<header th:replace="~{fragments/layout :: header('my')}"></header>
<main id="main-content" class="page-shell quiz-result-shell">
    <header class="page-heading"><div><p class="eyebrow">QUIZ COMPLETE</p><h1>빠른 퀴즈 완료</h1><p class="subtle">정규 학습과 분리된 확인 활동 결과입니다.</p></div></header>
    <section class="surface quiz-result-summary" aria-labelledby="quiz-result-title">
        <div class="section-heading"><h2 id="quiz-result-title">문제풀이 결과</h2><strong th:text="${quizResult.accuracyPercent + '%'}">80%</strong></div>
        <dl class="metric-strip compact-metrics"><div><dt>전체</dt><dd th:text="${quizResult.totalQuestions}">5</dd></div><div><dt>정답</dt><dd th:text="${quizResult.correctCount}">4</dd></div><div><dt>오답</dt><dd th:text="${quizResult.incorrectCount}">1</dd></div><div><dt>Quiz EXP</dt><dd th:text="${'+' + quizResult.earnedExperience}">+42</dd></div></dl>
        <p class="subtle">Quiz EXP는 주간 리포트에서 정규 학습 EXP와 구분해 표시됩니다.</p>
    </section>
    <section class="content-section" th:unless="${#lists.isEmpty(quizResult.incorrectItems)}">
        <div class="section-heading"><h2>다시 볼 콘텐츠</h2><span class="count" th:text="${quizResult.incorrectCount + '개'}">1개</span></div>
        <div class="quiz-review-list"><a class="quiz-review-row" th:each="item : ${quizResult.incorrectItems}" th:href="@{/contents/{slug}(slug=${item.slug})}"><span><strong lang="ja" th:text="${item.title}">표현</strong><small th:text="${'내 답 ' + item.submittedAnswer + ' · 정답 ' + item.correctAnswer}">정답</small></span><span>다시 보기 →</span></a></div>
    </section>
    <p class="empty-state" th:if="${#lists.isEmpty(quizResult.incorrectItems)}">모든 문제를 맞혔어요. 오늘 확인을 잘 마쳤습니다.</p>
    <div class="toolbar quiz-result-actions">
        <form th:action="@{/quiz/session/{id}/restart(id=${quizResult.sessionId})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="button" type="submit">다시 풀기</button></form>
        <a class="button-secondary" href="/weaknesses">약점 노트</a>
        <a class="text-link" href="/today">오늘 학습 계속하기</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
