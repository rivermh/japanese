<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('이메일 인증')}"></head>
<body><header th:replace="~{fragments/layout :: header('home')}"></header>
<main id="main-content" class="page-shell auth-shell">
  <header class="page-heading"><p class="eyebrow">VERIFY EMAIL</p><h1>이메일을 확인해 주세요</h1><p class="subtle">인증 링크는 24시간 동안 한 번만 사용할 수 있습니다.</p></header>
  <section class="surface detail-section" aria-labelledby="verification-title">
    <div class="section-heading"><h2 id="verification-title">인증 안내</h2></div>
    <p class="form-message success" role="status" th:if="${accountMessage != null}" th:text="${accountMessage}"></p>
    <form class="auth-form" th:action="@{/email-verification/resend}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="field"><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="email" maxlength="160" th:value="${verificationEmail}" required></div>
      <button class="button button-secondary" type="submit">인증 메일 다시 보내기</button>
    </form>
    <p class="auth-switch subtle"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
  </section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
