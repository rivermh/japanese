<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('이메일 인증 결과')}"></head>
<body class="editorial-page secondary-auth-page"><header th:replace="~{fragments/layout :: header('home')}"></header>
<main id="main-content" class="page-shell auth-shell"><section class="surface detail-section account-result">
  <p class="eyebrow">EMAIL VERIFICATION</p>
  <h1 th:if="${verificationResult.name() == 'SUCCESS'}">이메일 인증을 완료했습니다</h1>
  <h1 th:if="${verificationResult.name() == 'ALREADY_VERIFIED'}">이미 인증된 이메일입니다</h1>
  <h1 th:if="${verificationResult.name() == 'INVALID_OR_EXPIRED'}">인증 링크를 확인해 주세요</h1>
  <p class="subtle" th:if="${verificationResult.name() == 'INVALID_OR_EXPIRED'}">링크가 잘못되었거나 만료되었습니다. 인증 메일을 다시 요청할 수 있습니다.</p>
  <p class="account-result-actions"><a class="button" th:href="@{/login}">로그인</a><a class="button-secondary" th:if="${verificationResult.name() == 'INVALID_OR_EXPIRED'}" th:href="@{/email-verification}">인증 메일 다시 받기</a></p>
</section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
