<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('학습 기록')}"></head>
<body><header th:replace="~{fragments/layout :: header('history')}"></header>
<main id="main-content" class="page-shell">
    <header class="page-heading"><div><p class="eyebrow">LEARNING HISTORY</p><h1>학습 기록</h1><p class="subtle">실제 학습과 퀴즈 기록을 날짜별로 확인합니다.</p></div><a class="button button-secondary" href="/today">오늘의 학습</a></header>
    <section class="surface detail-section"><div class="section-heading"><a class="button-quiet" th:href="@{/history(month=${previousMonth})}">← 이전</a><h2 th:text="${activity.month}"></h2><a class="button-quiet" th:href="@{/history(month=${nextMonth})}">다음 →</a></div><div class="activity-calendar"><a th:each="day : ${activity.days}" th:classappend="${day.totalActivityCount > 0 ? ' has-activity' : ''}" th:href="@{/history(month=${activity.month},date=${day.date})}"><time th:text="${day.date.dayOfMonth}"></time><strong th:if="${day.totalActivityCount > 0}" th:text="${day.totalActivityCount}"></strong></a></div><p class="subtle">숫자는 새 학습·복습·재학습·퀴즈를 합친 활동 수입니다.</p></section>
    <section class="surface detail-section report-section"><div class="section-heading"><h2 th:text="${#temporals.format(report.date, 'M월 d일') + ' 기록'}"></h2><span class="subtle" th:text="${report.earnedExperience + ' EXP'}"></span></div><dl class="metric-strip compact-metrics"><div><dt>새 단어</dt><dd th:text="${report.newWordCount}"></dd></div><div><dt>새 문법</dt><dd th:text="${report.newGrammarCount}"></dd></div><div><dt>복습</dt><dd th:text="${report.reviewCount}"></dd></div><div><dt>재학습</dt><dd th:text="${report.retrainCount}"></dd></div><div><dt>퀴즈</dt><dd th:text="${report.quizAttemptCount}"></dd></div><div><dt>정답 / 다시 보기</dt><dd th:text="${report.correctCount + ' / ' + report.incorrectCount}"></dd></div></dl><p class="subtle" th:text="${'정규 목표 ' + report.regularGoalCompleted + ' / ' + report.dailyGoal + ' · 현재 Streak ' + report.currentStreak + '일'}"></p><div class="recent-history-list" th:unless="${#lists.isEmpty(report.activities)}"><a class="recent-history-row" th:each="entry : ${report.activities}" th:href="@{/contents/{slug}(slug=${entry.slug})}"><span class="type-pill" th:text="${entry.activityType.name() == 'NEW' ? '새 학습' : (entry.activityType.name() == 'REVIEW' ? '복습' : '재학습')}"></span><strong lang="ja" th:text="${entry.title}"></strong><span class="reading" lang="ja" th:if="${entry.reading != null}" th:text="${entry.reading}"></span><span class="history-result" th:text="${entry.result.name() == 'CORRECT' ? '완료' : '다시 보기'}"></span></a></div><p class="empty-state" th:if="${#lists.isEmpty(report.activities)}">이 날짜에 기록된 카드 학습이 없습니다.</p></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
