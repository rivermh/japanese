<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 재설정')}"></head>
<body class="editorial-page secondary-auth-page"><header th:replace="~{fragments/layout :: header('home')}"></header>
<main id="main-content" class="page-shell auth-shell">
  <header class="page-heading"><p class="eyebrow">RESET PASSWORD</p><h1>비밀번호를 다시 설정하세요</h1><p class="subtle">가입할 때 사용한 이메일로 30분 동안 유효한 링크를 보냅니다.</p></header>
  <section class="surface detail-section"><p class="form-message success" role="status" th:if="${accountMessage != null}" th:text="${accountMessage}"></p>
    <form class="auth-form" th:action="@{/forgot-password}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="field"><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="email" maxlength="160" required></div>
      <button class="button" type="submit">재설정 링크 받기</button>
    </form><p class="auth-switch subtle"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
  </section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
