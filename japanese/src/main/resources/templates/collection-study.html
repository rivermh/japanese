<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${collection.name + ' 학습'})}"></head>
<body class="editorial-page collection-focus-page">
<header th:replace="~{fragments/layout :: header('collections')}"></header>
<main id="main-content" class="page-shell review-entry-shell">
    <header class="page-heading"><div><p class="eyebrow">COLLECTION STUDY</p><h1 th:text="${collection.name}">나만의 단어장</h1><p class="subtle">저장한 표현을 한 번에 하나씩 다시 떠올립니다.</p></div><a class="text-link" th:href="@{/collections/{id}(id=${collection.id})}">단어장으로</a></header>
    <section class="review-focus" th:if="${!#lists.isEmpty(cards)}" th:with="card=${cards[0]}">
        <div class="review-focus-progress"><span th:text="${#lists.size(cards) + '개 남음'}">1개 남음</span><span>EXP와 오늘 목표에는 포함되지 않습니다.</span></div>
        <article class="review-focus-card"><div class="card-meta"><span>저장한 표현</span><span th:text="${card.type.name() == 'WORD' ? '단어' : '문법'}">단어</span></div><div class="review-focus-prompt"><h2 lang="ja" th:text="${card.title}">食べる</h2><p>뜻을 먼저 떠올려보세요.</p></div>
            <details class="recall-reveal"><summary>답 보기</summary><div class="recall-answer"><p class="reading" lang="ja" th:if="${card.reading != null}" th:text="${card.reading}">たべる</p><p class="recall-meaning" th:text="${card.description}">먹다</p><a class="text-link" th:href="@{/contents/{slug}(slug=${card.slug})}">상세 보기</a></div><div class="recall-grade"><form th:action="@{/collections/{id}/study/{slug}/answer(id=${collection.id},slug=${card.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="sessionKey" th:value="${studySessionKey}"><input type="hidden" name="result" value="INCORRECT"><button class="button-secondary" type="submit">다시 볼게요</button></form><form th:action="@{/collections/{id}/study/{slug}/answer(id=${collection.id},slug=${card.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="sessionKey" th:value="${studySessionKey}"><input type="hidden" name="result" value="CORRECT"><button class="button" type="submit">기억했어요</button></form></div></details>
        </article>
    </section>
    <section class="empty-state" th:if="${#lists.isEmpty(cards)}"><h2>단어장의 학습을 마쳤어요.</h2><p>다른 표현을 추가하거나 단어장으로 돌아가세요.</p><a class="button" th:href="@{/collections/{id}(id=${collection.id})}">단어장으로</a></section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
