<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${collection.name + ' 학습'})}"></head>
<body><header th:replace="~{fragments/layout :: header('collections')}"></header>
<main id="main-content" class="page-shell study-shell">
    <header class="page-heading"><div><p class="eyebrow">COLLECTION STUDY</p><h1 th:text="${collection.name}"></h1><p class="subtle">자유 학습입니다. SRS는 갱신하지만 EXP와 오늘 목표는 증가하지 않습니다.</p></div><a class="button button-secondary" th:href="@{/collections/{id}(id=${collection.id})}">단어장으로</a></header>
    <section class="study-list" th:unless="${#lists.isEmpty(cards)}"><article class="study-card" th:each="card : ${cards}"><div class="card-meta"><span class="type-pill" th:text="${card.type.name() == 'WORD' ? '단어' : '문법'}"></span></div><h2 lang="ja" th:text="${card.title}"></h2><p class="reading" lang="ja" th:if="${card.reading != null}" th:text="${card.reading}"></p><p class="description" th:text="${card.description}"></p><div class="study-actions"><form th:action="@{/collections/{id}/study/{slug}/answer(id=${collection.id},slug=${card.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="sessionKey" th:value="${studySessionKey}"><input type="hidden" name="result" value="CORRECT"><button type="submit">확인했어요</button></form><form th:action="@{/collections/{id}/study/{slug}/answer(id=${collection.id},slug=${card.slug})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="sessionKey" th:value="${studySessionKey}"><input type="hidden" name="result" value="INCORRECT"><button class="button-secondary" type="submit">다시 볼게요</button></form></div></article></section>
    <section class="surface empty-state" th:if="${#lists.isEmpty(cards)}"><p>학습할 콘텐츠가 없습니다.</p><a class="button" th:href="@{/collections/{id}(id=${collection.id})}">단어장으로</a></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
