spring.application.name=japanese
spring.profiles.default=sample
spring.config.import=optional:file:./secrets.yml,optional:file:./japanese/secrets.yml,optional:file:./config/secrets.yml

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/japanese?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:japanese}
spring.datasource.password=${DB_PASSWORD:japanese}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.cache=false
japanese.learning.daily-goal=10
japanese.learning.time-zone=Asia/Seoul
japanese.security.session-timeout-minutes=120
server.servlet.session.timeout=${japanese.security.session-timeout-minutes}m
japanese.account.public-base-url=${ACCOUNT_PUBLIC_BASE_URL:http://localhost:8080}
japanese.account.mail.mode=${ACCOUNT_MAIL_MODE:development}
japanese.account.mail.from=${ACCOUNT_MAIL_FROM:no-reply@localhost}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
