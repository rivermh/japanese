# 복사 후 secrets.yml로 이름을 바꾸고 로컬 값으로 수정합니다.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/japanese?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: your_database_username
    password: your_database_password

japanese:
  import:
    apkg-path: C:/path/to/JLPT-MAX-Deck-2.1.1.apkg
    # 0 imports all active vocabulary and all grammar notes. Media files are never extracted.
    limit: 0
    grammar-enabled: true
