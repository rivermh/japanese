<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Japanese Mobile Prototype · Today</title>
  <link rel="stylesheet" href="../css/prototype.css"><script defer src="../js/prototype.js"></script>
</head>
<body class="mobile-body mobile-study">
<div class="prototype-note mobile-note"><span>Mobile study prototype</span><a href="../today.html">Desktop</a></div>
<header class="mobile-header">
  <a class="study-exit" href="index.html">닫기</a>
  <div class="mobile-study-progress"><div class="progress-track"><span class="progress-fill" data-progress-fill style="--value:33%"></span></div></div>
  <span class="mobile-study-count"><span data-current>1</span> / 3</span>
</header>
<main class="mobile-main" style="padding-top:12px">
  <article class="mobile-learning-sheet" data-lesson>
    <div class="card-meta"><span data-field="activity">복습</span><span data-field="kind">단어</span><span data-field="level">JLPT N5</span></div>
    <h1 lang="ja" data-field="title">食べる</h1>
    <p class="learning-reading" lang="ja" data-field="reading">たべる</p>
    <div class="learning-rule"></div>
    <section class="meaning-block"><span class="meaning-number">01</span><div><h2><span data-field="meaning">먹다, 식사하다</span><span class="part-of-speech" data-field="pos">동사 · 2그룹</span></h2></div></section>
    <div class="example">
      <p class="example-jp" lang="ja" data-field="example">毎朝、家で朝ご飯を食べます。</p>
      <p class="example-reading" lang="ja" data-field="exampleReading">まいあさ、いえで あさごはんを たべます。</p>
      <p class="example-translation" data-field="translation">매일 아침 집에서 아침밥을 먹습니다.</p>
    </div>
    <dl class="grammar-note" data-grammar-only hidden><dt>접속</dt><dd data-field="connection"></dd><dt>핵심 설명</dt><dd data-field="explanation"></dd></dl>
    <div class="mobile-companion-reaction" aria-label="Haru의 학습 반응">
      <span class="companion-name">Haru</span>
      <p data-study-reaction>천천히 떠올려 봐요.</p>
      <span class="companion-peek"><img src="../assets/haru-young.png" alt=""></span>
    </div>
  </article>
  <section class="completion-sheet" data-completion>
    <h1>오늘 학습 완료</h1><p>복습과 새 학습을 모두 마쳤어요.</p>
    <div class="completion-summary" style="grid-template-columns:1fr 1fr"><div><strong>1</strong><span>복습</span></div><div><strong>2</strong><span>새 학습</span></div><div><strong>+30</strong><span>EXP</span></div><div><strong>5일</strong><span>Streak</span></div></div>
    <a class="button" href="index.html" style="width:100%;margin-top:20px">홈으로 돌아가기</a>
  </section>
</main>
<div class="study-actions" data-study-actions>
  <button class="button secondary" data-study-answer="incorrect">다시 볼게요</button>
  <button class="button" data-study-answer="correct">기억했어요</button>
</div>
</body>
</html>
